    const getEcuadorDateTime = () => {
      const now = new Date();
      const ecuadorOffset = -5 * 60 * 60 * 1000;
      const localOffset = now.getTimezoneOffset() * 60 * 1000;
      const ecuadorTime = new Date(now.getTime() + localOffset + ecuadorOffset);
      
      return {
        date: ecuadorTime,
        dateString: ecuadorTime.getFullYear() + '-' + 
                    String(ecuadorTime.getMonth() + 1).padStart(2, '0') + '-' + 
                    String(ecuadorTime.getDate()).padStart(2, '0'),
        timeString: String(ecuadorTime.getHours()).padStart(2, '0') + ':' + 
                    String(ecuadorTime.getMinutes()).padStart(2, '0'),
        displayDate: String(ecuadorTime.getDate()).padStart(2, '0') + '/' + 
                     String(ecuadorTime.getMonth() + 1).padStart(2, '0') + '/' + 
                     ecuadorTime.getFullYear()
      };
    };

    const normalizeName = (name) => {
      if (!name) return '';
      return name
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    };

    const namesMatch = (name1, name2) => {
      if (!name1 || !name2) return false;
      
      const normalized1 = normalizeName(name1);
      const normalized2 = normalizeName(name2);
      
      if (normalized1 === normalized2) return true;
      
      const words1 = normalized1.split(' ').filter(w => w.length > 2);
      const words2 = normalized2.split(' ').filter(w => w.length > 2);
      
      const matchingWords = words1.filter(w1 => words2.some(w2 => w1 === w2 || w1.includes(w2) || w2.includes(w1)));
      
      return matchingWords.length >= 2;
    };

    const supabaseRequest = async (endpoint, method = 'GET', body = null) => {
      const options = {
        method,
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        }
      };
      if (body) options.body = JSON.stringify(body);

      const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, options);
      if (!res.ok) {
        let errText = 'Error en la petición';
        try { const j = await res.json(); errText = j.message || j.error || errText; } catch {}
        throw new Error(errText);
      }
      if (res.status === 204) return null;
      const txt = await res.text();
      if (!txt) return null;
      return JSON.parse(txt);
    };

    const uploadFileToStorage = async (file, folder = 'justificaciones') => {
      try {
        const timestamp = Date.now();
        const randomStr = Math.random().toString(36).substring(7);
        const extension = file.name.split('.').pop();
        const fileName = `${folder}/${timestamp}_${randomStr}.${extension}`;

        const formData = new FormData();
        formData.append('file', file);

        const res = await fetch(`${SUPABASE_URL}/storage/v1/object/atrasos-adjuntos/${fileName}`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: formData
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          console.error('Error al subir archivo a Storage:', errData);
          
          if (res.status === 404) {
            throw new Error('❌ El bucket "atrasos-adjuntos" no existe. Por favor créalo en Supabase Storage.');
          } else if (res.status === 403) {
            throw new Error('❌ Sin permisos para subir archivos. Configura las políticas RLS del bucket.');
          } else {
            throw new Error(errData.message || errData.error || `Error ${res.status} al subir archivo`);
          }
        }

        const publicURL = `${SUPABASE_URL}/storage/v1/object/public/atrasos-adjuntos/${fileName}`;
        
        return { 
          url: publicURL, 
          name: file.name, 
          size: file.size, 
          type: file.type,
          storage: 'supabase'
        };
      } catch (err) {
        console.error('Error en uploadFileToStorage:', err);
        throw err;
      }
    };

    function FileUpload({ onFileSelect, selectedFile }) {
      const [isDragging, setIsDragging] = useState(false);
      const fileInputRef = useRef(null);

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = () => {
        setIsDragging(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        const file = e.dataTransfer.files[0];
        if (file) onFileSelect(file);
      };

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (file) onFileSelect(file);
      };

      useEffect(() => { if (window.lucide) window.lucide.replace(); }, [selectedFile]);

      return (
        <div>
          <label className="block text-sm font-semibold text-gray-700 mb-2">
            Adjuntar Evidencia (Opcional)
          </label>
          <div
            className={`file-upload-zone rounded-lg p-6 text-center cursor-pointer ${isDragging ? 'drag-over' : ''}`}
            onDragOver={handleDragOver}
            onDragLeave={handleDragLeave}
            onDrop={handleDrop}
            onClick={() => fileInputRef.current?.click()}
          >
            <input
              ref={fileInputRef}
              type="file"
              onChange={handleFileChange}
              className="hidden"
              accept="image/*,.pdf,.doc,.docx"
            />
            
            {selectedFile ? (
              <div className="flex items-center justify-center gap-3">
                <i data-lucide="file-check" style={{width:24,height:24}} className="text-institutional-blue"></i>
                <div className="text-left">
                  <p className="font-semibold text-institutional-blue">{selectedFile.name}</p>
                  <p className="text-sm text-gray-500">{(selectedFile.size / 1024).toFixed(2)} KB</p>
                </div>
                <button
                  onClick={(e) => { e.stopPropagation(); onFileSelect(null); }}
                  className="text-red-500 hover:text-red-700 p-1"
                >
                  <i data-lucide="x" style={{width:20,height:20}}></i>
                </button>
              </div>
            ) : (
              <div>
                <i data-lucide="upload-cloud" style={{width:40,height:40}} className="mx-auto mb-3 text-institutional-blue"></i>
                <p className="text-institutional-blue font-semibold mb-1">
                  Arrastra un archivo aquí
                </p>
                <p className="text-sm text-gray-500">
                  o haz clic para seleccionar
                </p>
                <p className="text-xs text-gray-400 mt-2">
                  Formatos: PDF, DOC, DOCX, Imágenes
                </p>
              </div>
            )}
          </div>
        </div>
      );
    }

    function Login({ onLogin }) {
      const [userType, setUserType] = useState('estudiante');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      
      const [nombreCompleto, setNombreCompleto] = useState('');
      const [cedula, setCedula] = useState('');
      const [nivelEducativo, setNivelEducativo] = useState('');
      const [anoGrado, setAnoGrado] = useState('');
      const [especialidad, setEspecialidad] = useState('');
      const [paralelo, setParalelo] = useState('');
      const [showRegister, setShowRegister] = useState(false);

      // Auto-relleno desde tabla atrasos
      const [isLookingUp, setIsLookingUp] = useState(false);
      const [autoFilled, setAutoFilled] = useState(false);
      const [cursoDesdeAtrasos, setCursoDesdeAtrasos] = useState('');
      const lookupTimeout = useRef(null);

      const getAnoGradoOptions = () => {
        if (!nivelEducativo) return [];
        const nivel = CURSOS_ESTRUCTURA[nivelEducativo];
        if (!nivel) return [];
        return Object.keys(nivel.cursos);
      };

      const getParalelosDisponibles = () => {
        if (!nivelEducativo || !anoGrado) return [];
        
        const nivel = CURSOS_ESTRUCTURA[nivelEducativo];
        if (!nivel) return [];
        
        const curso = nivel.cursos[anoGrado];
        if (!curso) return [];
        
        if (curso.especialidades) {
          if (!especialidad) return [];
          const esp = curso.especialidades[especialidad];
          return esp ? esp.paralelos : [];
        }
        
        return curso.paralelos || [];
      };

      const getEspecialidadesDisponibles = () => {
        if (nivelEducativo !== 'bachillerato' || !anoGrado) return [];
        
        const nivel = CURSOS_ESTRUCTURA.bachillerato;
        const curso = nivel.cursos[anoGrado];
        
        if (!curso || !curso.especialidades) return [];
        return Object.keys(curso.especialidades);
      };

      const construirCursoCompleto = () => {
        if (!nivelEducativo || !anoGrado || !paralelo) return '';
        
        const nivel = CURSOS_ESTRUCTURA[nivelEducativo];
        if (!nivel) return '';
        
        const curso = nivel.cursos[anoGrado];
        if (!curso) return '';
        
        if (curso.especialidades && especialidad) {
          const esp = curso.especialidades[especialidad];
          if (!esp) return '';
          return esp.formatoDB.replace('{paralelo}', paralelo);
        }
        
        if (curso.formatoDB) {
          return curso.formatoDB.replace('{paralelo}', paralelo);
        }
        
        return '';
      };

      useEffect(() => {
        setAnoGrado('');
        setEspecialidad('');
        setParalelo('');
      }, [nivelEducativo]);

      useEffect(() => {
        setEspecialidad('');
        setParalelo('');
      }, [anoGrado]);

      useEffect(() => {
        setParalelo('');
      }, [especialidad]);

      // Auto-relleno: buscar estudiante en atrasos cuando cambia el email
      useEffect(() => {
        if (!showRegister) return;
        setAutoFilled(false);
        setCursoDesdeAtrasos('');
        setNombreCompleto('');
        
        if (!email.endsWith('@est.uepdc.edu.ec') || email.length < 10) return;

        if (lookupTimeout.current) clearTimeout(lookupTimeout.current);
        
        lookupTimeout.current = setTimeout(async () => {
          setIsLookingUp(true);
          try {
            const results = await supabaseRequest(
              `atrasos?${encodeURIComponent('Email estudiante')}=eq.${encodeURIComponent(email)}&select=${encodeURIComponent('Nombre completo estudiante')},Curso&limit=1`
            );
            if (results && results.length > 0) {
              const found = results[0];
              setNombreCompleto(found['Nombre completo estudiante'] || '');
              setCursoDesdeAtrasos(found['Curso'] || '');
              setAutoFilled(true);
            } else {
              setAutoFilled(false);
              setCursoDesdeAtrasos('');
            }
          } catch (e) {
            console.error('Error al buscar en atrasos:', e);
          } finally {
            setIsLookingUp(false);
          }
        }, 700);
      }, [email, showRegister]);

      const handleLogin = async () => {
        setError('');
        setSuccess('');
        
        if (!email.trim() || !password.trim()) {
          setError('Por favor completa todos los campos');
          return;
        }

        if (userType === 'inspeccion') {
          try {
            const user = await loginInspector(email, password);
            if (user) {
              onLogin('inspeccion', email, { 
                nombre_completo: user.nombre, 
                email: user.email,
                nombreCompletoInspector: user.nombre_completo 
              });
            } else {
              setError('Credenciales de inspección incorrectas');
            }
          } catch (err) {
            setError('Error al verificar credenciales: ' + err.message);
          }
          return;
        }

        if (!email.endsWith('@est.uepdc.edu.ec')) {
          setError('El correo debe terminar en @est.uepdc.edu.ec');
          return;
        }

        try {
          const users = await supabaseRequest(`usuarios_estudiantes?email=eq.${encodeURIComponent(email)}&select=*`);
          
          if (!users || users.length === 0) {
            setError('Usuario no encontrado. Por favor regístrate primero.');
            return;
          }

          const user = users[0];
          if (user.password !== password) {
            setError('Contraseña incorrecta');
            return;
          }

          onLogin('estudiante', email, user);
        } catch (err) {
          setError('Error al iniciar sesión: ' + err.message);
        }
      };

      const handleRegister = async () => {
        setError('');
        setSuccess('');
        
        // Si los datos se llenaron automáticamente, solo requerimos email, password y cedula
        if (autoFilled) {
          if (!email.trim() || !password.trim() || !cedula.trim()) {
            setError('Por favor completa todos los campos obligatorios');
            return;
          }
          if (!email.endsWith('@est.uepdc.edu.ec')) {
            setError('El correo debe terminar en @est.uepdc.edu.ec');
            return;
          }
          try {
            const existing = await supabaseRequest(`usuarios_estudiantes?email=eq.${encodeURIComponent(email)}&select=*`);
            if (existing && existing.length > 0) {
              setError('Este correo ya está registrado');
              return;
            }
            const newUser = {
              email: email,
              password: password,
              nombre_completo: nombreCompleto,
              cedula: cedula,
              curso: cursoDesdeAtrasos
            };
            await supabaseRequest('usuarios_estudiantes', 'POST', newUser);
            setSuccess('¡Cuenta creada exitosamente! Ahora puedes iniciar sesión.');
            setEmail(''); setPassword(''); setNombreCompleto(''); setCedula('');
            setCursoDesdeAtrasos(''); setAutoFilled(false);
            setTimeout(() => { setShowRegister(false); setSuccess(''); }, 2000);
          } catch (err) {
            setError('Error al registrar: ' + err.message);
          }
          return;
        }

        // Formulario manual: todos los campos requeridos
        if (!email.trim() || !password.trim() || !nombreCompleto.trim() || !cedula.trim() || !nivelEducativo || !anoGrado || !paralelo) {
          setError('Por favor completa todos los campos obligatorios');
          return;
        }

        if (nivelEducativo === 'bachillerato' && !especialidad) {
          setError('Por favor selecciona una especialidad para Bachillerato');
          return;
        }
        
        if (!email.endsWith('@est.uepdc.edu.ec')) {
          setError('El correo debe terminar en @est.uepdc.edu.ec');
          return;
        }

        try {
          const existing = await supabaseRequest(`usuarios_estudiantes?email=eq.${encodeURIComponent(email)}&select=*`);
          if (existing && existing.length > 0) {
            setError('Este correo ya está registrado');
            return;
          }

          const cursoCompleto = construirCursoCompleto();
          
          if (!cursoCompleto) {
            setError('Error al construir el curso. Por favor verifica los datos.');
            return;
          }

          const newUser = {
            email: email,
            password: password,
            nombre_completo: nombreCompleto,
            cedula: cedula,
            curso: cursoCompleto
          };

          await supabaseRequest('usuarios_estudiantes', 'POST', newUser);
          setSuccess('Registro exitoso. Ahora puedes iniciar sesión.');
          
          setEmail('');
          setPassword('');
          setNombreCompleto('');
          setCedula('');
          setNivelEducativo('');
          setAnoGrado('');
          setEspecialidad('');
          setParalelo('');
          
          setTimeout(() => {
            setShowRegister(false);
            setSuccess('');
          }, 2000);
        } catch (err) {
          setError('Error al registrar: ' + err.message);
        }
      };

      useEffect(() => { if (window.lucide) window.lucide.replace(); }, [error, success, userType, showRegister, nivelEducativo, anoGrado, especialidad, autoFilled, isLookingUp]);

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-600 via-blue-500 to-blue-700 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border-4 border-institutional-yellow">
            <div className="bg-gradient-to-r from-institutional-blue to-institutional-blue-dark p-8 relative overflow-hidden">
              <div className="absolute inset-0 bg-gradient-to-br from-blue-600/20 to-transparent"></div>

    function QRScanner({ onScan, onClose }) {
      const [isScanning, setIsScanning] = useState(false);
      const [error, setError] = useState('');
      const [capturedImage, setCapturedImage] = useState(null);
      const [showImageViewer, setShowImageViewer] = useState(false);
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);
      const scanIntervalRef = useRef(null);

      const startCamera = async () => {
        try {
          setError('');
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }});
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            streamRef.current = stream;
            setIsScanning(true);
            startAutoScan();
          }
        } catch (err) {
          setError('No se pudo acceder a la cámara. Por favor, da permisos de cámara.');
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        if (scanIntervalRef.current) {
          clearInterval(scanIntervalRef.current);
          scanIntervalRef.current = null;
        }
        setIsScanning(false);
      };

      const scanQRCode = () => {
        if (!videoRef.current || !canvasRef.current) return;
        
        const video = videoRef.current;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = window.jsQR ? window.jsQR(imageData.data, imageData.width, imageData.height) : null;

          if (code) {
            // No detenemos la cámara aquí, solo pausamos el escaneo
            if (scanIntervalRef.current) {
              clearInterval(scanIntervalRef.current);
              scanIntervalRef.current = null;
            }
            const qrData = code.data;
            const idMatch = qrData.match(/ID:(\d+)/i);
            const studentId = idMatch ? idMatch[1] : qrData;
            onScan(studentId);
          }
        }
      };

      const startAutoScan = () => {
        if (scanIntervalRef.current) {
          clearInterval(scanIntervalRef.current);
        }
        scanIntervalRef.current = setInterval(scanQRCode, 300);
      };

      const capturePhoto = () => {
        if (videoRef.current && canvasRef.current) {
          if (scanIntervalRef.current) {
            clearInterval(scanIntervalRef.current);
            scanIntervalRef.current = null;
          }
          
          const video = videoRef.current;
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          
          const imageDataUrl = canvas.toDataURL('image/png');
          setCapturedImage(imageDataUrl);
          setShowImageViewer(true);
          stopCamera();
        }
      };

      const processCapturedImage = () => {
        if (canvasRef.current) {
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = window.jsQR ? window.jsQR(imageData.data, imageData.width, imageData.height) : null;
          
          if (code) {
            const qrData = code.data;
            const idMatch = qrData.match(/ID:(\d+)/i);
            const studentId = idMatch ? idMatch[1] : qrData;
            onScan(studentId);
          } else {
            setError('No se detectó ningún código QR en la imagen. Intenta capturar nuevamente.');
          }
        }
      };

      const retakePhoto = () => {
        setCapturedImage(null);
        setShowImageViewer(false);
        setError('');
        startCamera();
      };

      useEffect(() => {
        startCamera();
        return () => stopCamera();
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.replace();
      }, [isScanning, error, showImageViewer]);

      return (
        <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden relative border-4 border-institutional-yellow">
            <button 
              onClick={() => { stopCamera(); onClose(); }} 
              className="absolute top-4 right-4 bg-red-500 hover:bg-red-600 text-white rounded-full p-2 z-10 flex items-center justify-center"
              style={{width: '40px', height: '40px'}}
            >
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div className="bg-institutional-blue p-4">
              <div className="flex items-center gap-2 text-white">
                <i data-lucide="qr-code" style={{width:24,height:24}}></i>
                <h2 className="text-xl font-bold">Escanear Código QR</h2>
              </div>
            </div>

            <div className="p-6">
              {error && <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm flex items-center gap-2">
                <i data-lucide="alert-circle" style={{width:18,height:18}}></i>
                <span>{error}</span>
              </div>}

              {!showImageViewer ? (
                <>
                  {/* Vista de cámara en vivo - SIN ANIMACIONES */}
                  <div className="bg-black rounded-lg overflow-hidden border-4 border-institutional-yellow relative">
                    <div className="relative aspect-video">
                      <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
                    </div>
                  </div>

                  <canvas ref={canvasRef} className="hidden"></canvas>

                  <div className="mt-4 p-4 bg-blue-50 rounded-lg border-2 border-institutional-blue">
                    <p className="text-sm text-institutional-blue text-center flex items-center justify-center gap-2">
                      <i data-lucide="info" style={{width:18,height:18}}></i>
                      La cámara escanea automáticamente el código QR.
                    </p>
                  </div>
                </>
              ) : (
                <>
                  {/* Visor de imagen capturada */}
                  <div className="mb-6">
                    <div className="relative bg-black rounded-xl overflow-hidden border-4 border-institutional-yellow shadow-2xl">
                      <img src={capturedImage} alt="Imagen capturada" className="w-full h-auto" />
                      <div className="absolute top-3 right-3 bg-green-500 text-white px-3 py-1 rounded-full text-sm font-semibold flex items-center gap-1">
                        <i data-lucide="check" style={{width:16,height:16}}></i>
                        Capturada
                      </div>
                    </div>
                  </div>

                  {/* Botones de acción para imagen capturada */}
                  <div className="flex gap-3">
                    <button 
                      onClick={retakePhoto}
                      className="flex-1 bg-gray-500 text-white px-6 py-4 rounded-xl font-semibold text-lg hover:bg-gray-600 transition-all shadow-lg flex items-center justify-center gap-2"
                    >
                      <i data-lucide="rotate-ccw" style={{width:22,height:22}}></i>
                      Tomar otra foto
                    </button>
                    <button 
                      onClick={processCapturedImage}
                      className="flex-1 bg-institutional-blue text-white px-6 py-4 rounded-xl font-semibold text-lg hover:bg-institutional-blue-dark transition-all shadow-lg flex items-center justify-center gap-2 border-2 border-institutional-yellow"
                    >
                      <i data-lucide="scan" style={{width:22,height:22}}></i>
                      Procesar QR
                    </button>
                  </div>

                  <div className="mt-4 p-4 bg-blue-50 rounded-lg border-2 border-institutional-blue">
                    <p className="text-sm text-institutional-blue text-center flex items-center justify-center gap-2">
                      <i data-lucide="check-circle" style={{width:18,height:18}}></i>
                      Verifica que el código QR sea visible y presiona "Procesar QR"
                    </p>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    function FileViewerModal({ fileData, onClose }) {
      useEffect(() => { 
        if (window.lucide) window.lucide.replace();
      }, []);

      const handleDownload = () => {
        if (!fileData) return;
        
        const link = document.createElement('a');
        if (fileData.url) {
          link.href = fileData.url;
          link.download = fileData.name || 'archivo';
          link.target = '_blank';
        } else if (fileData.data) {
          link.href = fileData.data;
          link.download = fileData.name || 'archivo';
        } else {
          alert('No se puede descargar este archivo porque no tiene URL ni datos.');
          return;
        }
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const isImage = fileData && fileData.type && fileData.type.startsWith('image/');
      const isPDF = fileData && fileData.type && fileData.type === 'application/pdf';
      const fileSource = fileData && (fileData.url || fileData.data);
      const hasValidFile = !!fileSource;

      return (
        <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden border-4 border-institutional-yellow relative">
            <button 
              onClick={onClose} 
              className="absolute top-3 right-3 bg-red-500 text-white rounded-full p-2 hover:bg-red-600 z-20"
              style={{width: '40px', height: '40px', boxShadow: '0 2px 8px rgba(0,0,0,0.3)'}}
              title="Cerrar"
            >
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>

            <div className="p-6 max-h-[90vh] overflow-y-auto">
              {hasValidFile ? (
                <div className="border-4 border-institutional-yellow rounded-xl overflow-hidden bg-gray-100">
                  {isImage ? (
                    <img src={fileSource} alt="Archivo adjunto" className="w-full h-auto" onError={(e) => {
                      console.error('Error al cargar imagen:', fileSource);
                      e.target.style.display = 'none';
                      e.target.parentElement.innerHTML = '<div class="p-8 text-center"><p class="text-red-600">Error al cargar la imagen</p></div>';
                    }} />
                  ) : isPDF ? (
                    <iframe 
                      src={fileSource} 
                      className="w-full h-[600px]"
                      title="Archivo PDF"
                      onError={(e) => {
                        console.error('Error al cargar PDF:', fileSource);
                      }}
                    />
                  ) : (
                    <div className="p-8 text-center">
                      <i data-lucide="file" style={{width:64,height:64}} className="mx-auto mb-4 text-gray-400"></i>
                      <p className="text-gray-600">Vista previa no disponible para este tipo de archivo.</p>
                    </div>
                  )}
                </div>
              ) : (
                <div className="border-4 border-orange-400 rounded-xl p-8 text-center bg-orange-50">
                  <i data-lucide="alert-triangle" style={{width:64,height:64}} className="mx-auto mb-4 text-orange-500"></i>
                  <p className="text-lg font-bold text-orange-700 mb-2">⚠️ Archivo No Disponible</p>
                  <p className="text-gray-700">Este archivo no se puede mostrar.</p>

    function AttendanceHistory({ records, loading, onRefresh, userRole, userData, onJustify }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [dateFilter, setDateFilter] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [viewingFile, setViewingFile] = useState(null);

      const normalizeDate = (dateString) => {
        if (!dateString) return '';
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateString)) return dateString;
        return dateString.split('T')[0];
      };

      const isJustified = (record) => {
        if (record.estado === 'justificado') return true;
        return record.motivo_atraso && (
          record.motivo_atraso.includes('[ARCHIVO_ADJUNTO:') || 
          record.motivo_atraso.includes('[Archivo adjunto:')
        );
      };

      const getAttachedFile = (motivo, record) => {
        if (record && record.archivo_adjunto) {
          if (typeof record.archivo_adjunto === 'string') {
            try {
              return JSON.parse(record.archivo_adjunto);
            } catch (e) {
              console.error('Error al parsear archivo_adjunto:', e);
              return null;
            }
          }
          return record.archivo_adjunto;
        }
        if (!motivo) return null;
        
        const newFormatMatch = motivo.match(/\[ARCHIVO_ADJUNTO:({.*?})\]/);
        if (newFormatMatch) {
          try {
            return JSON.parse(newFormatMatch[1]);
          } catch (e) {
            console.error('Error al parsear archivo adjunto:', e);
            return null;
          }
        }
        
        const oldFormatMatch = motivo.match(/\[Archivo adjunto: (.*?)\]/);
        if (oldFormatMatch) {
          return { name: oldFormatMatch[1], data: null };
        }
        
        return null;
      };

      const getCleanMotivo = (motivo) => {
        if (!motivo) return 'Sin especificar';
        return motivo.replace(/\[ARCHIVO_ADJUNTO:.*?\]/, '').replace(/\[Archivo adjunto:.*?\]/, '').trim() || 'Sin especificar';
      };

      const filteredRecords = records.filter(record => {
        const matchesSearch = !searchTerm || 
          (record['Nombre completo estudiante']?.toLowerCase().includes(searchTerm.toLowerCase()) || 
           record.Curso?.toLowerCase().includes(searchTerm.toLowerCase()));
        
        let matchesDate = true;
        if (dateFilter) {
          const recordDateStr = normalizeDate(record.fecha_atraso);
          matchesDate = recordDateStr === dateFilter;
        }
        
        let matchesStatus = true;
        if (statusFilter === 'confirmado') {
          matchesStatus = record.estado === 'confirmado' && !isJustified(record);
        } else if (statusFilter === 'justificado') {
          matchesStatus = isJustified(record);
        }
        
        const hasValidStatus = record.estado === 'confirmado' || record.estado === 'justificado';
        
        if (userRole === 'estudiante' && userData) {
          const studentNameInRecord = record['Nombre completo estudiante'];
          const loggedInStudentName = userData.nombre_completo;
          const matchesStudent = namesMatch(studentNameInRecord, loggedInStudentName);
          
          return matchesSearch && matchesDate && matchesStatus && hasValidStatus && matchesStudent;
        }
        
        return matchesSearch && matchesDate && matchesStatus && hasValidStatus;
      });

      const dedupedRecords = (() => {
        const justifiedKeys = new Set();
        filteredRecords.forEach(r => {
          if (r.estado === 'justificado') {
            justifiedKeys.add(`${r['Nombre completo estudiante']}|${r.fecha_atraso}|${r.hora_llegada}`);
          }
        });
        return filteredRecords.filter(r => {
          if (r.estado === 'confirmado') {
            const key = `${r['Nombre completo estudiante']}|${r.fecha_atraso}|${r.hora_llegada}`;
            if (justifiedKeys.has(key)) return false;
          }
          return true;
        });
      })();

      useEffect(()=> { if (window.lucide) window.lucide.replace(); }, [records, searchTerm, dateFilter, statusFilter, loading]);
      const clearFilters = () => {
        setSearchTerm('');
        setDateFilter('');
        setStatusFilter('all');
      };

      return (
        <div className="bg-white rounded-2xl shadow-lg overflow-hidden border-4 border-institutional-yellow">
          <div className="bg-institutional-yellow p-4 md:p-6">
            <div className="flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 text-gray-800 min-w-0">
                <svg className="flex-shrink-0" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><path d="M20 8v6"></path><path d="M23 11h-6"></path></svg>
                <h2 className="text-lg md:text-2xl font-bold">Historial de Atrasos</h2>
              </div>
              <button onClick={onRefresh} className="bg-gradient-to-r from-white to-gray-50 text-institutional-blue px-3 md:px-5 py-2 rounded-lg font-bold hover:from-gray-50 hover:to-white flex items-center gap-1 md:gap-2 border-2 border-institutional-blue shadow-md transition-all text-sm md:text-base flex-shrink-0">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"></path></svg>
                Actualizar
              </button>
            </div>
          </div>

          <div className="p-6 border-b-2 border-institutional-yellow bg-gray-50">
            <div className={`grid grid-cols-1 md:grid-cols-${userRole === 'inspeccion' ? '4' : '3'} gap-4`}>
              {userRole === 'inspeccion' && (
                <input 
                  type="text" 
                  value={searchTerm} 
                  onChange={(e)=>setSearchTerm(e.target.value)} 
                  placeholder="Buscar por nombre o curso" 
                  className="border-2 border-institutional-blue rounded-lg p-2 focus:ring-2 focus:ring-institutional-yellow transition-all" 
                />
              )}
              <input 
                type="date" 
                value={dateFilter} 
                onChange={(e)=>setDateFilter(e.target.value)} 
                className="border-2 border-institutional-blue rounded-lg p-2 focus:ring-2 focus:ring-institutional-yellow transition-all" 
              />
              <select 
                value={statusFilter} 
                onChange={(e)=>setStatusFilter(e.target.value)} 
                className="border-2 border-institutional-blue rounded-lg p-2 focus:ring-2 focus:ring-institutional-yellow transition-all"
              >
                <option value="all">Todos los estados</option>
                <option value="confirmado">Confirmados</option>
                <option value="justificado">Justificados</option>
              </select>
              <button 
                onClick={clearFilters}
                className="bg-gradient-to-r from-gray-200 to-gray-300 text-gray-800 px-4 py-2 rounded-lg font-bold hover:from-gray-300 hover:to-gray-200 flex items-center justify-center gap-2 shadow-sm border-2 border-gray-400"
              >
                <i data-lucide="filter-x" style={{width:20,height:20}}></i> Limpiar
              </button>
            </div>
          </div>

          <div className="p-6">
            {loading ? (
              <div className="text-center py-8">
                <div className="spinner rounded-full h-12 w-12 border-b-4 border-institutional-blue mx-auto"></div>
                <p className="mt-4 text-gray-600">Cargando historial...</p>
              </div>
            ) : (
              <>
                <div className="text-sm text-gray-600 mb-4 flex items-center gap-2">
                  <i data-lucide="database" style={{width:16,height:16}} className="text-institutional-blue"></i>
                  Mostrando {dedupedRecords.length} de {records.length} registros
                </div>
                <div className="overflow-x-auto -mx-6 px-6">
                  <table className="w-full min-w-[600px]">
                    <thead className="bg-institutional-blue text-white"><tr>
                      <th className="text-left p-2 md:p-3 text-xs md:text-sm font-semibold whitespace-nowrap">Fecha</th>
                      <th className="text-left p-2 md:p-3 text-xs md:text-sm font-semibold">Estudiante</th>
                      <th className="text-left p-2 md:p-3 text-xs md:text-sm font-semibold">Curso</th>
                      <th className="text-left p-2 md:p-3 text-xs md:text-sm font-semibold whitespace-nowrap">Hora</th>
                      <th className="text-left p-2 md:p-3 text-xs md:text-sm font-semibold">Motivo</th>
                      {userRole === 'inspeccion' && <th className="text-left p-2 md:p-3 text-xs md:text-sm font-semibold whitespace-nowrap">Registrado por</th>}
                      <th className="text-left p-2 md:p-3 text-xs md:text-sm font-semibold">Estado</th>
                      {userRole === 'inspeccion' && <th className="text-left p-2 md:p-3 text-xs md:text-sm font-semibold">Acciones</th>}
                    </tr></thead>
                    <tbody>
                      {dedupedRecords.length === 0 ? (
                        <tr><td colSpan={userRole === 'inspeccion' ? '8' : '6'} className="text-center py-8 text-gray-500">
                          <i data-lucide="search-x" style={{width:48,height:48}} className="mx-auto mb-2 text-gray-300"></i>
                          <p>No se encontraron registros de atrasos</p>
                        </td></tr>
                      ) : (
                        dedupedRecords.map((record, index) => (
                          <tr key={record.N || index} className="border-b-2 border-gray-100 hover:bg-yellow-50 transition-all">
                            <td className="p-2 md:p-3 text-xs md:text-sm whitespace-nowrap">{new Date(record.fecha_atraso + 'T00:00:00').toLocaleDateString('es-ES')}</td>
                            <td className="p-2 md:p-3 text-xs md:text-sm font-medium">{record['Nombre completo estudiante']}</td>
                            <td className="p-2 md:p-3 text-xs md:text-sm">{record.Curso}</td>
                            <td className="p-2 md:p-3 text-xs md:text-sm">
                              <span className="flex items-center gap-1 whitespace-nowrap">
                                <i data-lucide="clock" style={{width:12,height:12}} className="text-institutional-blue"></i>
                                {record.hora_llegada || 'N/A'}
                              </span>
                            </td>
                            <td className="p-2 md:p-3 text-xs md:text-sm text-gray-600">
                              <div className="flex items-center gap-2">
                                <span>{getCleanMotivo(record.motivo_atraso)}</span>
                                {(() => {
                                  const attachedFile = getAttachedFile(record.motivo_atraso, record);
                                  if (attachedFile) {
                                    return (
                                      <div className="flex items-center gap-1">
                                        <button
                                          onClick={() => setViewingFile(attachedFile)}
                                          className="bg-institutional-blue text-white px-2 py-1 rounded text-xs font-semibold hover:bg-institutional-blue-dark flex items-center gap-1"
                                          title={attachedFile.name || "Ver archivo adjunto"}
                                        >
                                          <i data-lucide="paperclip" style={{width:12,height:12}}></i>
                                          {attachedFile.name ? attachedFile.name.substring(0, 15) + (attachedFile.name.length > 15 ? '...' : '') : 'Ver'}
                                        </button>
                                      </div>
                                    );
                                  }
                                  return null;
                                })()}
                              </div>
                            </td>
                            {userRole === 'inspeccion' && <td className="p-2 md:p-3 text-xs md:text-sm text-gray-600">{record.registrado_por || 'N/A'}</td>}
                            <td className="p-2 md:p-3">
                              {isJustified(record) ? (
                                <span className="inline-flex items-center gap-1 bg-institutional-blue text-white px-2 py-1 rounded-full text-xs font-semibold whitespace-nowrap">
                                  <i data-lucide="file-check" style={{width:12,height:12}}></i> Justificado
                                </span>
                              ) : record.estado === 'confirmado' ? (
                                <span className="inline-flex items-center gap-1 bg-institutional-yellow text-gray-800 px-2 py-1 rounded-full text-xs font-semibold border-2 border-institutional-blue whitespace-nowrap">
                                  <i data-lucide="alert-circle" style={{width:12,height:12}}></i> Confirmado
                                </span>
                              ) : (
                                <span className="inline-flex items-center gap-1 bg-gray-200 text-gray-700 px-2 py-1 rounded-full text-xs font-semibold whitespace-nowrap">
                                  <i data-lucide="clock" style={{width:12,height:12}}></i> Pendiente
                                </span>
                              )}
                            </td>
                            {userRole === 'inspeccion' && (
                              <td className="p-2 md:p-3">
                                {!isJustified(record) ? (
                                  <button
                                    onClick={() => onJustify(record)}
                                    className="bg-institutional-blue text-white px-2 py-1 rounded-lg text-xs font-semibold hover:bg-institutional-blue-dark flex items-center gap-1 whitespace-nowrap"
                                  >
                                    <i data-lucide="file-edit" style={{width:12,height:12}}></i>
                                    Justificar
                                  </button>
                                ) : (
                                  <span className="inline-flex items-center gap-1 bg-institutional-blue text-white px-2 py-1 rounded-full text-xs font-semibold whitespace-nowrap">
                                    <i data-lucide="file-check" style={{width:12,height:12}}></i> Justificado
                                  </span>
                                )}
                              </td>
                            )}
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </>
            )}
          </div>

          {viewingFile && <FileViewerModal fileData={viewingFile} onClose={() => setViewingFile(null)} />}
        </div>
      );
    }

    function App(){
      const [userRole, setUserRole] = useState(null);
      const [userEmail, setUserEmail] = useState('');
      const [userData, setUserData] = useState(null);
      const [view, setView] = useState('scanner');
      const [showScanner, setShowScanner] = useState(false);
      const [showManualInput, setShowManualInput] = useState(false);
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [notification, setNotification] = useState(null);
      const [records, setRecords] = useState([]);
      const [loading, setLoading] = useState(false);
      const [justificationRecord, setJustificationRecord] = useState(null);

      const handleLogin = (role, email, user) => {
        setUserRole(role);
        setUserEmail(email);
        setUserData(user);
        if (role === 'estudiante') {
          setView('history');
        }
      };

      const handleLogout = () => {
        setUserRole(null);
        setUserEmail('');
        setUserData(null);
        setView('scanner');
      };

      useEffect(()=> {
        if (view === 'history') loadAttendanceRecords();
      }, [view]);

      useEffect(()=> {
        if (window.lucide) window.lucide.replace();
      }, [view, showScanner, showManualInput, selectedStudent, notification, records, userRole, justificationRecord]);

      const showNotification = (type, message) => {
        setNotification({type, message});
        setTimeout(()=> setNotification(null), 4000);
      };

      const handleJustification = (record) => {
        setJustificationRecord(record);
      };

      const submitJustification = async (justification, file) => {
        setIsSubmitting(true);
        try {
          let fileInfo = null;

          if (file) {
            fileInfo = await uploadFileToStorage(file);
          }

          const updateData = {
            estado: 'justificado',
            motivo_atraso: justification
          };

          if (fileInfo) {
            updateData.archivo_adjunto = fileInfo;
          }

          await supabaseRequest(`atrasos?N=eq.${justificationRecord.N}`, 'PATCH', updateData);

          showNotification('success', 'Justificación guardada correctamente');
          setJustificationRecord(null);
          await loadAttendanceRecords();
        } catch (err) {
          console.error('Error al justificar:', err);
          showNotification('error', 'Error al guardar la justificación: ' + err.message);
        } finally {
          setIsSubmitting(false);
        }
      };

      const findStudent = async (searchTerm) => {
        try {
          setIsSubmitting(true);
          
          if (!searchTerm || searchTerm.trim() === '') {
            showNotification('error', 'Ingrese el nombre del estudiante');
            setIsSubmitting(false);
            setShowScanner(false);
            setShowManualInput(false);
            return;
          }
          
          let students = [];

          if (!isNaN(searchTerm)) {
            const byId = await supabaseRequest(`atrasos?N=eq.${searchTerm}&select=*&limit=1`);
            if (byId && byId.length > 0) students = [byId[0]];
          }

          if (students.length === 0) {
            const byName = await supabaseRequest(`atrasos?or=(Nombre%20completo%20estudiante.ilike.*${encodeURIComponent(searchTerm)}*,Curso.ilike.*${encodeURIComponent(searchTerm)}*)&select=*&limit=1`);
            if (byName && byName.length > 0) students = [byName[0]];
          }

          if (!students || students.length === 0) {
            showNotification('error','Estudiante no encontrado');
            setIsSubmitting(false);
            setShowScanner(false);
            setShowManualInput(false);
            return;
          }

          const student = students[0];
          
          const ecuadorDateTime = getEcuadorDateTime();
          const today = ecuadorDateTime.dateString;
          
          const todayQuery = `Nombre%20completo%20estudiante=eq.${encodeURIComponent(student['Nombre completo estudiante'])}&fecha_atraso=eq.${today}&estado=in.(confirmado,justificado)`;
          const existingRecords = await supabaseRequest(`atrasos?${todayQuery}`);

          if (existingRecords && existingRecords.length > 0) {
            showNotification('error','Este estudiante ya tiene un registro de atraso hoy');
            setIsSubmitting(false);
            setShowScanner(false);
            setShowManualInput(false);
            return;
          }

          setSelectedStudent(student);
          // NO cerramos el scanner aquí - se cerrará cuando el usuario confirme o cancele
          setShowManualInput(false);
          setIsSubmitting(false);
        } catch (err) {
          console.error('Error al buscar estudiante:', err);
          showNotification('error','Error al buscar estudiante: ' + err.message);
          setIsSubmitting(false);
          setShowScanner(false);
          setShowManualInput(false);
        }
      };

      const handleConfirmAttendance = async (recordedBy) => {
        setIsSubmitting(true);
        try {
          const ecuadorDateTime = getEcuadorDateTime();

          const studentEmail = selectedStudent['Email estudiante'];
          const studentName = selectedStudent['Nombre completo estudiante'];
          
          let existingEmptyRow = null;
          
          if (studentEmail) {
            const byEmail = await supabaseRequest(`atrasos?Email estudiante=eq.${encodeURIComponent(studentEmail)}&fecha_atraso=is.null`);
            if (byEmail && byEmail.length > 0) {
              existingEmptyRow = byEmail[0];
            }
          }
          
          if (!existingEmptyRow) {
            const byName = await supabaseRequest(`atrasos?Nombre completo estudiante=eq.${encodeURIComponent(studentName)}&fecha_atraso=is.null`);
            if (byName && byName.length > 0) {
              existingEmptyRow = byName[0];
            }
          }

          if (existingEmptyRow) {
            const updateData = {
              fecha_atraso: ecuadorDateTime.dateString,
              hora_llegada: ecuadorDateTime.timeString,
              registrado_por: recordedBy,
              estado: 'confirmado'
            };
            
            await supabaseRequest(`atrasos?N=eq.${existingEmptyRow.N}`, 'PATCH', updateData);
            showNotification('success', `Atraso confirmado para ${studentName}`);
          } else {
            const newRecord = {
              'Nombre completo estudiante': studentName,
              Curso: selectedStudent.Curso,
              'Email estudiante': studentEmail || null,
              fecha_atraso: ecuadorDateTime.dateString,
              hora_llegada: ecuadorDateTime.timeString,
              registrado_por: recordedBy,
              estado: 'confirmado'
            };
            
            await supabaseRequest(`atrasos`, 'POST', newRecord);
            showNotification('success', `Atraso confirmado para ${studentName}`);
          }
          
          setSelectedStudent(null);
          setShowScanner(false); // Cerrar el scanner después de confirmar
          await loadAttendanceRecords();
        } catch (err) {
          console.error('Error al guardar:', err);
          showNotification('error','Error al registrar el atraso: ' + err.message);
        } finally {
          setIsSubmitting(false);
        }
      };

      const loadAttendanceRecords = async () => {
        setLoading(true);
        try {
          const allRecords = await supabaseRequest('atrasos?select=*&estado=in.(confirmado,justificado)&order=fecha_atraso.desc,hora_llegada.desc&limit=1000');
          setRecords(allRecords || []);
        } catch (err) {
          console.error('Error al cargar registros:', err);
          showNotification('error','Error al cargar el historial: ' + err.message);
          setRecords([]);
        } finally {
          setLoading(false);
        }
      };

      if (!userRole) {
        return <Login onLogin={handleLogin} />;
      }

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 via-white to-yellow-50">
          <header className="bg-institutional-blue shadow-lg border-b-4 border-institutional-yellow">
            <div className="container mx-auto px-3 py-4">
              <div className="flex justify-between items-center gap-2">
                <div className="flex items-center gap-3 min-w-0">
                  <img src={LOGO_URL} alt="UEPDC Logo" className="w-12 h-12 md:w-16 md:h-16 flex-shrink-0" />
                  <div className="min-w-0">
                    <h1 className="text-lg md:text-3xl font-bold text-white drop-shadow-lg leading-tight">
                      Sistema de Atrasos
                    </h1>
                    <p className="text-yellow-200 mt-0.5 font-semibold text-xs md:text-sm truncate">
                      {userRole === 'inspeccion' ? '🛡️ Inspección' : '👨‍🎓 Estudiante'} - {userData?.nombreCompletoInspector || userData?.nombre_completo || userEmail}
                    </p>
                  </div>
                </div>
                <button 
                  onClick={handleLogout}
                  className="bg-gradient-to-r from-institutional-yellow to-institutional-yellow-dark text-gray-800 px-3 md:px-6 py-2 rounded-lg font-bold hover:from-institutional-yellow-dark hover:to-institutional-yellow flex items-center gap-1 md:gap-2 border-2 border-white shadow-lg transition-all flex-shrink-0 text-sm md:text-base"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                  <span className="hidden sm:inline">Cerrar Sesión</span>
                  <span className="sm:hidden">Salir</span>
                </button>
              </div>
            </div>
          </header>

          {notification && (
            <div className="fixed top-4 right-4 z-50">
              <div className={`rounded-lg shadow-2xl p-4 flex items-center gap-3 max-w-md border-4 ${
                notification.type === 'success' 
                  ? 'bg-institutional-blue text-white border-institutional-yellow' 
                  : 'bg-red-500 text-white border-red-700'
              }`}>
                <i data-lucide={notification.type === 'success' ? 'check-circle' : 'alert-circle'} style={{width:24,height:24}}></i>
                <span className="font-semibold">{notification.message}</span>
              </div>
            </div>
          )}

          {userRole === 'inspeccion' && (
            <nav className="bg-white shadow-md sticky top-0 z-40 border-b-4 border-institutional-yellow">
              <div className="container mx-auto px-3">
                <div className="flex justify-center gap-2 py-3">
                  <button onClick={()=>setView('scanner')} className={`flex items-center gap-2 px-4 md:px-6 py-2.5 md:py-3 rounded-lg font-bold transition-all text-sm md:text-base ${view==='scanner' ? 'bg-gradient-to-r from-institutional-yellow to-institutional-yellow-dark text-gray-800 shadow-lg border-2 border-institutional-blue' : 'bg-gray-100 text-gray-600 hover:bg-gray-200 border-2 border-gray-300'}`}>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="9"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                    Registrar Atraso
                  </button>
                  <button onClick={()=>setView('history')} className={`flex items-center gap-2 px-4 md:px-6 py-2.5 md:py-3 rounded-lg font-bold transition-all text-sm md:text-base ${view==='history' ? 'bg-gradient-to-r from-institutional-yellow to-institutional-yellow-dark text-gray-800 shadow-lg border-2 border-institutional-blue' : 'bg-gray-100 text-gray-600 hover:bg-gray-200 border-2 border-gray-300'}`}>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4  4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><path d="M20 8v6"></path><path d="M23 11h-6"></path></svg>
                    Historial
                  </button>
                </div>
              </div>
            </nav>
          )}

          <main className="container mx-auto px-3 md:px-4 py-4 md:py-8">
            {view === 'scanner' && userRole === 'inspeccion' ? (
              <div className="max-w-2xl mx-auto">
                <div className="bg-white rounded-2xl shadow-lg p-8 md:p-12 border-4 border-institutional-yellow">
                  <div className="text-center mb-8">
                    <img src={LOGO_URL} alt="UEPDC Logo" className="w-24 h-24 mx-auto mb-4" />
                    <h2 className="text-2xl md:text-3xl font-bold text-gray-800 mb-3">Registrar Atraso Estudiantil</h2>
                    <p className="text-gray-600">Selecciona un método para identificar al estudiante</p>
                  </div>

                  <div className="space-y-4">
                    <button onClick={()=>setShowScanner(true)} className="w-full bg-institutional-blue text-white py-4 px-6 rounded-xl font-semibold hover:bg-institutional-blue-dark transition-all shadow-lg flex items-center justify-center gap-3 text-lg border-2 border-institutional-yellow">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                      Escanear Código QR
                    </button>

                    <button onClick={()=>setShowManualInput(true)} className="w-full bg-institutional-yellow text-gray-800 py-4 px-6 rounded-xl font-semibold hover:bg-institutional-yellow-dark transition-all shadow-lg flex items-center justify-center gap-3 text-lg border-2 border-institutional-blue">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="2" y1="17" x2="22" y2="17"></line></svg>
                      Ingreso Manual
                    </button>
                  </div>

                  <div className="mt-8 p-4 bg-blue-50 rounded-lg border-2 border-institutional-blue">
                    <p className="text-sm text-institutional-blue text-center flex items-center justify-center gap-2">
                      <i data-lucide="info" style={{width:18,height:18}}></i>
                      <strong>Nota:</strong> El sistema valida automáticamente que no existan registros duplicados del mismo día
                    </p>
                  </div>
                </div>
              </div>
            ) : (
              <AttendanceHistory 
                records={records} 
                loading={loading} 
                onRefresh={loadAttendanceRecords} 
                userRole={userRole}
                userData={userData}
                onJustify={handleJustification}
              />
            )}
          </main>

          {showScanner && <QRScanner onScan={findStudent} onClose={()=>setShowScanner(false)} />}
          {showManualInput && <ManualInput onSubmit={findStudent} onClose={()=>setShowManualInput(false)} />}
          {selectedStudent && <StudentModal student={selectedStudent} onConfirm={handleConfirmAttendance} onClose={()=>{setSelectedStudent(null); setShowScanner(false);}} isSubmitting={isSubmitting} userData={userData} />}
          {justificationRecord && <JustificationModal record={justificationRecord} onClose={()=>setJustificationRecord(null)} onSubmit={submitJustification} isSubmitting={isSubmitting} />}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>

  <script>
    setTimeout(()=> { if (window.lucide) window.lucide.replace(); }, 100);
  </script>
</body>
</html>
