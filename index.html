    const getEcuadorDateTime = () => {
      const now = new Date();
      const ecuadorOffset = -5 * 60 * 60 * 1000;
      const localOffset = now.getTimezoneOffset() * 60 * 1000;
      const ecuadorTime = new Date(now.getTime() + localOffset + ecuadorOffset);
      return {
        date: ecuadorTime,
        dateString: ecuadorTime.getFullYear() + '-' +
          String(ecuadorTime.getMonth() + 1).padStart(2, '0') + '-' +
          String(ecuadorTime.getDate()).padStart(2, '0'),
        timeString: String(ecuadorTime.getHours()).padStart(2, '0') + ':' +
          String(ecuadorTime.getMinutes()).padStart(2, '0') + ':' +
          String(ecuadorTime.getSeconds()).padStart(2, '0')
      };
    };
    const supabaseRequest = async (endpoint, method = 'GET', body = null, preferReturn = false) => {
      const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      };
      if (preferReturn && (method === 'POST' || method === 'PATCH')) {
        headers['Prefer'] = 'return=representation';
      }
      const options = { method, headers };
      if (body && (method === 'POST' || method === 'PATCH' || method === 'PUT')) {
        options.body = JSON.stringify(body);
      }
      console.log(`[supabaseRequest] ${method} ${url}`, body || '');
      const response = await fetch(url, options);
      if (!response.ok) {
        const errorText = await response.text();
        console.error(`[supabaseRequest] Error ${response.status}:`, errorText);
        throw new Error(`Error ${response.status}: ${errorText || response.statusText}`);
      }
      const text = await response.text();
      if (!text) {
        console.log('[supabaseRequest] Respuesta vacía (204 No Content)');
        return [];
      }
      try {
        const json = JSON.parse(text);
        console.log('[supabaseRequest] Respuesta JSON:', json);
        return json;
      } catch (err) {
        console.error('[supabaseRequest] Error al parsear JSON:', err, 'Texto:', text);
        return [];
      }
    };
    function Login({ onLogin }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');

        setError('');
        setLoading(true);
        try {
          const authUser = AUTHORIZED_USERS.find(u => u.email === email && u.password === password);
          if (authUser) {
            onLogin('inspeccion', email, {
              nombreCompletoInspector: authUser.nombreCompleto,
              nombre: authUser.nombre
            });
            return;
          }
          const studentsData = await supabaseRequest(`atrasos?Correo%20electr%C3%B3nico%20estudiante=eq.${encodeURIComponent(email)}&select=*&limit=1`);
          if (studentsData && studentsData.length > 0) {
            const student = studentsData[0];
            onLogin('estudiante', email, {
              nombre_completo: student['Nombre completo estudiante'],
              curso: student.Curso
            });
            return;
          }

        } catch (err) {

    function FileUpload({ onFileSelect, selectedFile }) {
      const [isDragging, setIsDragging] = useState(false);
      const fileInputRef = useRef(null);
      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };
      const handleDragLeave = (e) => {
        e.preventDefault();
        setIsDragging(false);
      };
      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          onFileSelect(files[0]);
        }
      };
      const handleFileChange = (e) => {
        if (e.target.files.length > 0) {
          onFileSelect(e.target.files[0]);
        }
      };
      const removeFile = () => {
        onFileSelect(null);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };
      useEffect(() => {
        if (window.lucide) window.lucide.replace();
      }, [selectedFile]);
      return (
        <div>
          <label className="block text-sm font-semibold text-gray-700 mb-2">Adjuntar Evidencia (Opcional)</label>
          {!selectedFile ? (
            <div
              className={`file-upload-zone rounded-lg p-6 text-center cursor-pointer transition-all ${
                isDragging ? 'drag-over' : 'bg-gray-50 hover:bg-gray-100'
              }`}
              onDragOver={handleDragOver}
              onDragLeave={handleDragLeave}
              onDrop={handleDrop}
              onClick={() => fileInputRef.current?.click()}
            >
              <input
                ref={fileInputRef}
                type="file"
                onChange={handleFileChange}
                className="hidden"
                accept="image/*,.pdf,.doc,.docx"
              />
              <i data-lucide="upload" style={{width:48,height:48}} className="mx-auto mb-3 text-institutional-blue"></i>
              <p className="text-gray-600 font-semibold mb-1">Arrastra un archivo o haz clic para seleccionar</p>
              <p className="text-sm text-gray-500">Imágenes, PDF o documentos</p>
            </div>
          ) : (
            <div className="bg-blue-50 border-2 border-institutional-blue rounded-lg p-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="bg-institutional-blue rounded-lg p-2">

                className="text-red-500 hover:bg-red-50 rounded-lg p-2 transition-all"

    function QRScanner({ onScan, onClose }) {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const scanIntervalRef = useRef(null);
      const [isScanning, setIsScanning] = useState(false);
      const [error, setError] = useState('');
      const [capturedImage, setCapturedImage] = useState(null);
      const [showImageViewer, setShowImageViewer] = useState(false);
      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
          });
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.onloadedmetadata = () => {
              setIsScanning(true);
              setError('');
              startAutoScan();
            };
          }
        } catch (err) {
          console.error('Error al acceder a la cámara:', err);
          setError('No se pudo acceder a la cámara. Verifica los permisos.');
        }
      };
      const stopCamera = () => {
        if (scanIntervalRef.current) {
          clearInterval(scanIntervalRef.current);
          scanIntervalRef.current = null;
        }
        if (videoRef.current && videoRef.current.srcObject) {
          const tracks = videoRef.current.srcObject.getTracks();
          tracks.forEach(track => track.stop());
          videoRef.current.srcObject = null;
        }
        setIsScanning(false);
      };
      const scanQRCode = () => {
        if (videoRef.current && canvasRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = window.jsQR ? window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" }) : null;
          if (code) {
            stopCamera();
            onScan(code.data);
          }
        }
      };
      const startAutoScan = () => {
        if (scanIntervalRef.current) {
          clearInterval(scanIntervalRef.current);
        }
        scanIntervalRef.current = setInterval(scanQRCode, 300);
      };
      const capturePhoto = () => {
        if (videoRef.current && canvasRef.current) {
          if (scanIntervalRef.current) {
            clearInterval(scanIntervalRef.current);
            scanIntervalRef.current = null;
          }
          const video = videoRef.current;
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageDataUrl = canvas.toDataURL('image/png');
          setCapturedImage(imageDataUrl);
          setShowImageViewer(true);
          stopCamera();
        }
      };
      const processCapturedImage = () => {
        if (canvasRef.current) {
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = window.jsQR ? window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" }) : null;
          if (code) {
            onScan(code.data);
          } else {
            setError('No se detectó ningún código QR en la imagen. Intenta capturar nuevamente.');
          }
        }
      };
      const retakePhoto = () => {
        setCapturedImage(null);
        setShowImageViewer(false);
        setError('');
        startCamera();
      };
      useEffect(() => {
        startCamera();
        return () => stopCamera();
      }, []);
      useEffect(() => {
        if (window.lucide) window.lucide.replace();
      }, [isScanning, error, showImageViewer]);
      return (
        <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4 ">
          <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden relative border-4 border-institutional-yellow ">
            <button
              onClick={() => { stopCamera(); onClose(); }}
              className="absolute top-4 right-4 bg-red-500  text-white rounded-full p-2 z-10 flex items-center justify-center"
              style={{width: '40px', height: '40px'}}
            >
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div className="bg-institutional-blue p-4">
              <div className="flex items-center gap-2 text-white">
                <i data-lucide="qr-code" style={{width:24,height:24}}></i>
                <h2 className="text-xl font-bold">Escanear Código QR</h2>
              </div>
            </div>
            <div className="p-6">
              {error && <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm  flex items-center gap-2">
                <i data-lucide="alert-circle" style={{width:18,height:18}}></i>
                <span>{error}</span>
              </div>}
              {!showImageViewer ? (
                <>
                  <div className="bg-black rounded-lg overflow-hidden border-4 border-institutional-yellow relative">
                    <div className="relative aspect-video">
                      <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
                    </div>
                  </div>
                  <canvas ref={canvasRef} className="hidden"></canvas>
                  <div className="mt-4">
                    {isScanning && (
                      <button
                        onClick={capturePhoto}
                        className="w-full bg-institutional-yellow text-gray-800 px-6 py-4 rounded-xl font-bold text-lg  transition-all shadow-lg flex items-center justify-center gap-2 border-2 border-institutional-blue "
                      >
                        <i data-lucide="camera" style={{width:24,height:24}}></i>
                        Capturar Foto
                      </button>
                    )}
                  </div>
                  <div className="mt-4 p-4 bg-blue-50 rounded-lg border-2 border-institutional-blue">
                    <p className="text-sm text-institutional-blue text-center flex items-center justify-center gap-2">
                      <i data-lucide="info" style={{width:18,height:18}}></i>
                      La cámara escanea automáticamente. También puedes capturar una foto para revisarla.
                    </p>
                  </div>
                </>
              ) : (
                <>
                  <div className="mb-6">
                    <div className="relative bg-black rounded-xl overflow-hidden border-4 border-institutional-yellow shadow-2xl">

    function AttendanceHistory({ records, loading, onRefresh, userRole, userData, onJustify }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [dateFilter, setDateFilter] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [viewingFile, setViewingFile] = useState(null);
      const normalizeDate = (dateString) => {
        if (!dateString) return '';
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateString)) return dateString;
        return dateString.split('T')[0];
      };
      const isJustified = (record) => {
        if (record.estado === 'justificado') return true;
        return record.motivo_atraso && (
          record.motivo_atraso.includes('[ARCHIVO_ADJUNTO:') ||
          record.motivo_atraso.includes('[Archivo adjunto:')
        );
      };
      const getAttachedFile = (motivo) => {
        if (!motivo) return null;
        const newFormatMatch = motivo.match(/\[ARCHIVO_ADJUNTO:({.*?})\]/);
        if (newFormatMatch) {
          try {
            return JSON.parse(newFormatMatch[1]);
          } catch (e) {
            console.error('Error al parsear archivo adjunto:', e);
            return null;
          }
        }
        const oldFormatMatch = motivo.match(/\[Archivo adjunto: (.*?)\]/);
        if (oldFormatMatch) {
          return { name: oldFormatMatch[1], data: null };
        }
        return null;
      };
      const getCleanMotivo = (motivo) => {
        if (!motivo) return 'Sin especificar';
        return motivo.replace(/\[ARCHIVO_ADJUNTO:.*?\]/, '').replace(/\[Archivo adjunto:.*?\]/, '').trim() || 'Sin especificar';
      };
      const filteredRecords = records.filter(record => {
        const matchesSearch = !searchTerm ||
          (record['Nombre completo estudiante']?.toLowerCase().includes(searchTerm.toLowerCase()) ||
           record.Curso?.toLowerCase().includes(searchTerm.toLowerCase()));
        const normalizedRecordDate = normalizeDate(record.fecha_atraso);
        const normalizedFilterDate = normalizeDate(dateFilter);
        const matchesDate = !normalizedFilterDate || normalizedRecordDate === normalizedFilterDate;
        const recordIsJustified = isJustified(record);
        const matchesStatus = statusFilter === 'all' ||
          (statusFilter === 'justified' && recordIsJustified) ||
          (statusFilter === 'pending' && !recordIsJustified);
        if (userRole === 'estudiante' && userData) {
          return record['Nombre completo estudiante'] === userData.nombre_completo &&
                 matchesSearch && matchesDate && matchesStatus;
        }
        return matchesSearch && matchesDate && matchesStatus;
      });
      useEffect(() => {
        if (window.lucide) window.lucide.replace();
      }, [records, searchTerm, dateFilter, statusFilter, viewingFile]);
      return (

                                        className="mt-2 bg-institutional-yellow text-gray-800 px-3 py-1 rounded-lg text-xs font-semibold  flex items-center gap-1 "
                                      >
                                        <i data-lucide="paperclip" style={{width:12,height:12}}></i>
                                        Ver archivo
                                      </button>
                                    )}
                                  </div>
                                </div>
                              ) : (
                                <span className="inline-block bg-orange-100 text-orange-800 px-3 py-1 rounded-lg text-xs font-semibold">
                                  Pendiente
                                </span>
                              )}
                            </td>
                            {userRole === 'estudiante' && (
                              <td className="p-3">
                                {!isJustified(record) ? (
                                  <button
                                    onClick={() => onJustify(record)}
                                    className="bg-institutional-blue text-white px-3 py-1 rounded-lg text-xs font-semibold  flex items-center gap-1 "
                                  >
                                    <i data-lucide="file-edit" style={{width:12,height:12}}></i>
                                    Justificar
                                  </button>
                                ) : (
                                  <div className="justified-badge inline-flex items-center gap-2 text-white px-4 py-2 rounded-xl text-xs font-black shadow-lg  ">
                                    <div className="justified-badge-icon rounded-full p-1">
                                      <i data-lucide="badge-check" style={{width:16,height:16}} className="text-emerald-600"></i>
                                    </div>
                                    <span className="tracking-wide" style={{textShadow: '0 1px 2px rgba(0,0,0,0.3)'}}>JUSTIFICADO</span>
                                  </div>
                                )}
                              </td>
                            )}
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </>
            )}
          </div>
          {viewingFile && <FileViewerModal fileData={viewingFile} onClose={() => setViewingFile(null)} />}
        </div>
      );
    }
    function App(){
      const [userRole, setUserRole] = useState(null);
      const [userEmail, setUserEmail] = useState('');
      const [userData, setUserData] = useState(null);
      const [view, setView] = useState('scanner');
      const [showScanner, setShowScanner] = useState(false);
      const [showManualInput, setShowManualInput] = useState(false);
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [notification, setNotification] = useState(null);
      const [records, setRecords] = useState([]);
      const [loading, setLoading] = useState(false);
      const [justificationRecord, setJustificationRecord] = useState(null);
      const handleLogin = (role, email, user) => {
        setUserRole(role);
        setUserEmail(email);
        setUserData(user);
        if (role === 'estudiante') {
          setView('history');
        }
      };
      const handleLogout = () => {
        setUserRole(null);
        setUserEmail('');
        setUserData(null);
        setView('scanner');
      };
      useEffect(()=> {
        if (view === 'history') loadAttendanceRecords();
      }, [view]);
      useEffect(()=> {
        if (window.lucide) window.lucide.replace();
      }, [view, showScanner, showManualInput, selectedStudent, notification, records, userRole, justificationRecord]);
      const showNotification = (type, message) => {
        setNotification({type, message});
        setTimeout(()=> setNotification(null), 4000);
      };
      const handleJustification = (record) => {
        setJustificationRecord(record);
      };
      
      const submitJustification = async (justification, file) => {
        setIsSubmitting(true);
        try {
          // CORRECCIÓN: Asegurar que tenemos el campo N del registro
          console.log('Registro a justificar:', justificationRecord);
          
          if (!justificationRecord.N) {
            showNotification('error', 'No se pudo identificar el registro. Verifica que el registro tenga un ID válido.');
            setIsSubmitting(false);
            return;
          }

          let fileData = null;
          if (file) {
            const base64 = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = reject;
              reader.readAsDataURL(file);
            });
            fileData = {
              name: file.name,
              size: file.size,
              type: file.type,
              data: base64
            };
          }
          const motivoTexto = fileData
            ? `${justification} [ARCHIVO_ADJUNTO:${JSON.stringify(fileData)}]`
            : justification;

          console.log('PATCH justificar → N:', justificationRecord.N);
          
          // CORRECCIÓN: Usar el formato de query correcto para Supabase
          const patchResult = await supabaseRequest(
            `atrasos?N=eq.${justificationRecord.N}`, 
            'PATCH', 
            {
              motivo_atraso: motivoTexto,
              estado: 'justificado',
              Justificación: motivoTexto // Incluir también el campo Justificación
            },
            true // Solicitar que retorne el objeto actualizado
          );
          
          console.log('PATCH justificación resultado:', JSON.stringify(patchResult));
          
          if (!patchResult || (Array.isArray(patchResult) && patchResult.length === 0)) {
            showNotification('error', 'No se pudo guardar la justificación. Verifica las políticas RLS de la tabla.');
            setIsSubmitting(false);
            return;
          }

          showNotification('success', 'Justificación guardada correctamente');
          setJustificationRecord(null);
          await loadAttendanceRecords();
        } catch (err) {
          console.error('Error al justificar:', err);
          showNotification('error', 'Error al guardar la justificación: ' + err.message);
        } finally {
          setIsSubmitting(false);
        }
      };
      
      
      const parseQRData = (raw) => {
        const parsed = {};
        raw.split(';').forEach(seg => {
          const i = seg.indexOf(':');
          if (i === -1) return;
          const k = seg.substring(0, i).trim();
          const v = seg.substring(i + 1).trim();
          if (k && v) parsed[k] = v;
        });
        return parsed;
      };

      const findStudent = async (originalSearchTerm) => {
        try {
          setIsSubmitting(true);
          const raw = originalSearchTerm?.toString().trim();

          if (!raw) {
            showNotification('error', 'Ingrese el nombre o ID del estudiante');
            setIsSubmitting(false);
            setShowScanner(false);
            setShowManualInput(false);
            return;
          }

          let nombre = null;
          let id = null;
          const searchLower = raw.toLowerCase();

          if (searchLower.startsWith('id:') || searchLower.includes(';')) {
            const parsed = parseQRData(raw);
            nombre = parsed.Nombre || null;
            id = parsed.ID || null;
          } else {
            if (/^\d+$/.test(raw)) {
              id = raw;
            } else {
              nombre = raw;
            }
          }

          if (!nombre && !id) {
            showNotification('error', 'No se pudo extraer información válida del código o búsqueda');
            setIsSubmitting(false);
            setShowScanner(false);
            setShowManualInput(false);
            return;
          }

          // CORRECCIÓN: Asegurar que SELECT incluye el campo N
          let query = 'atrasos?select=N,Nombre%20completo%20estudiante,Curso,Correo%20electrónico%20estudiante,fecha_atraso,hora_llegada,motivo_atraso,estado,registrado_por,created_at,Justificación&limit=500';
          
          if (nombre) {
            query += `&Nombre%20completo%20estudiante=ilike.*${encodeURIComponent(nombre)}*`;
          } else if (id) {
            query += `&N=eq.${encodeURIComponent(id)}`;
          }

          const allStudents = await supabaseRequest(query);

          if (!allStudents || allStudents.length === 0) {
            showNotification('error', 'No se encontró el estudiante en la base de datos');
            setIsSubmitting(false);
            setShowScanner(false);
            setShowManualInput(false);
            return;
          }

          let matchedStudent = null;
          if (nombre && !id) {
            const partial = allStudents.filter(s => 
              s['Nombre completo estudiante']?.toLowerCase().includes(searchLower)
            );
            if (partial.length === 1) {
              matchedStudent = partial[0];
            } else if (partial.length > 1) {
              showNotification('error', `Se encontraron ${partial.length} coincidencias. Sé más específico.`);
              setIsSubmitting(false);
              setShowScanner(false);
              setShowManualInput(false);
              return;
            }
          } else {
            matchedStudent = allStudents[0];
          }

          if (!matchedStudent) {
            showNotification('error', 'No se encontró coincidencia exacta');
            setIsSubmitting(false);
            setShowScanner(false);
            setShowManualInput(false);
            return;
          }

          // Verificar duplicado del día
          const ecuadorDateTime = getEcuadorDateTime();
          const todayStr = ecuadorDateTime.dateString;
          const duplicateCheck = await supabaseRequest(
            `atrasos?Nombre%20completo%20estudiante=eq.${encodeURIComponent(matchedStudent['Nombre completo estudiante'])}&fecha_atraso=eq.${todayStr}&select=*&limit=1`
          );
          
          if (duplicateCheck && duplicateCheck.length > 0) {
            showNotification('error', 'Este estudiante ya tiene un registro de atraso el día de hoy');
            setIsSubmitting(false);
            setShowScanner(false);
            setShowManualInput(false);
            return;
          }

          setShowScanner(false);
          setShowManualInput(false);
          setSelectedStudent(matchedStudent);

        } catch (err) {
          console.error('Error al buscar estudiante:', err);
          showNotification('error', 'Error al buscar estudiante: ' + err.message);
          setIsSubmitting(false);
          setShowScanner(false);
          setShowManualInput(false);
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleConfirmAttendance = async (recordedBy) => {
        setIsSubmitting(true);
        try {
          if (selectedStudent.N == null) {
            showNotification('error', 'No se pudo identificar el registro (N es nulo). Recarga la página.');
            setIsSubmitting(false);
            return;
          }

          const ecuadorDateTime = getEcuadorDateTime();
          const patchPayload = {
            fecha_atraso: ecuadorDateTime.dateString,
            hora_llegada: ecuadorDateTime.timeString,
            registrado_por: recordedBy,
            estado: 'confirmado'
          };

          console.log('PATCH confirmar atraso → N:', selectedStudent.N);
          const patchResult = await supabaseRequest(
            `atrasos?N=eq.${selectedStudent.N}`, 
            'PATCH', 
            patchPayload,
            true
          );
          
          console.log('PATCH confirmar resultado:', JSON.stringify(patchResult));
          
          if (patchResult && Array.isArray(patchResult) && patchResult.length === 0) {
            console.error('PATCH retornó array vacío → la fila N=' + selectedStudent.N + ' no existe o RLS la bloquea');
            showNotification('error', 'No se pudo actualizar el registro. Verifica las políticas de la tabla.');
            setIsSubmitting(false);
            return;
          }

          showNotification('success', `Atraso confirmado para ${selectedStudent['Nombre completo estudiante']}`);
          setSelectedStudent(null);
          await loadAttendanceRecords();
        } catch (err) {
          console.error('Error al guardar:', err);
          showNotification('error','Error al registrar el atraso: ' + err.message);
        } finally {
          setIsSubmitting(false);
        }
      };
      
      const loadAttendanceRecords = async () => {
        setLoading(true);
        try {
          // CORRECCIÓN: Asegurar que SELECT incluye el campo N
          const allRecords = await supabaseRequest('atrasos?select=N,Nombre%20completo%20estudiante,Curso,Correo%20electrónico%20estudiante,fecha_atraso,hora_llegada,motivo_atraso,estado,registrado_por,created_at,Justificación&fecha_atraso=not.is.null&order=fecha_atraso.desc,hora_llegada.desc&limit=1000');
          setRecords(allRecords || []);
        } catch (err) {
          console.error('Error al cargar registros:', err);
          showNotification('error','Error al cargar el historial: ' + err.message);
          setRecords([]);
        } finally {
          setLoading(false);
        }
      };
      
      if (!userRole) {
        return <Login onLogin={handleLogin} />;
      }
      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 via-white to-yellow-50">
          <header className="bg-institutional-blue shadow-lg border-b-4 border-institutional-yellow">
            <div className="container mx-auto px-4 py-6">
              <div className="flex justify-between items-center flex-wrap gap-4">
                <div className="flex items-center gap-4">
                  <img src={LOGO_URL} alt="UEPDC Logo" className="logo-container" />
                  <div>
                    <h1 className="text-2xl md:text-3xl font-bold text-white drop-shadow-lg flex items-center gap-3">
                      Sistema de Atrasos
                    </h1>
                    <p className="text-yellow-200 mt-1 font-semibold text-sm">
                      {userRole === 'inspeccion' ? '🛡️ Panel de Inspección' : '👨‍🎓 Panel de Estudiantes'} - {userData?.nombreCompletoInspector || userData?.nombre_completo || userEmail}
                    </p>
                  </div>
                </div>
                <button
                  onClick={handleLogout}
                  className="bg-gradient-to-r from-institutional-yellow to-institutional-yellow-dark text-gray-800 px-6 py-2.5 rounded-lg font-bold   flex items-center gap-2 border-2 border-white  shadow-lg transition-all"
                >
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                  <span>Cerrar Sesión</span>
                </button>
              </div>
            </div>
          </header>
          {notification && (
            <div className="fixed top-4 right-4 z-50">
              <div className={`rounded-lg shadow-2xl p-4 flex items-center gap-3 max-w-md border-4 ${
                notification.type === 'success'
                  ? 'bg-institutional-blue text-white border-institutional-yellow'
                  : 'bg-red-500 text-white border-red-700'
              }`}>
                <i data-lucide={notification.type === 'success' ? 'check-circle' : 'alert-circle'} style={{width:24,height:24}}></i>
                <span className="font-semibold">{notification.message}</span>
              </div>
            </div>
          )}
          {userRole === 'inspeccion' && (
            <nav className="bg-white shadow-md sticky top-0 z-40 border-b-4 border-institutional-yellow">
              <div className="container mx-auto px-4">
                <div className="flex justify-center gap-3 py-4">
                  <button onClick={()=>setView('scanner')} className={`flex items-center gap-2 px-6 py-3 rounded-lg font-bold transition-all  ${view==='scanner' ? 'bg-gradient-to-r from-institutional-yellow to-institutional-yellow-dark text-gray-800 shadow-lg border-2 border-institutional-blue' : 'bg-gray-100 text-gray-600  border-2 border-gray-300'}`}>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="9"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                    Registrar Atraso
                  </button>
                  <button onClick={()=>setView('history')} className={`flex items-center gap-2 px-6 py-3 rounded-lg font-bold transition-all  ${view==='history' ? 'bg-gradient-to-r from-institutional-yellow to-institutional-yellow-dark text-gray-800 shadow-lg border-2 border-institutional-blue' : 'bg-gray-100 text-gray-600  border-2 border-gray-300'}`}>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4  4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><path d="M20 8v6"></path><path d="M23 11h-6"></path></svg>
                    Historial
                  </button>
                </div>
              </div>
            </nav>
          )}
          <main className="container mx-auto px-4 py-8">
            {view === 'scanner' && userRole === 'inspeccion' ? (
              <div className="max-w-2xl mx-auto ">
                <div className="bg-white rounded-2xl shadow-lg p-8 md:p-12 border-4 border-institutional-yellow ">
                  <div className="text-center mb-8">
                    <img src={LOGO_URL} alt="UEPDC Logo" className="w-24 h-24 mx-auto mb-4 " />
                    <h2 className="text-2xl md:text-3xl font-bold text-gray-800 mb-3">Registrar Atraso Estudiantil</h2>
                    <p className="text-gray-600">Selecciona un método para identificar al estudiante</p>
                  </div>
                  <div className="space-y-4">
                    <button onClick={()=>setShowScanner(true)} className="w-full bg-institutional-blue text-white py-4 px-6 rounded-xl font-semibold  transition-all shadow-lg flex items-center justify-center gap-3 text-lg border-2 border-institutional-yellow ">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                      Escanear Código QR
                    </button>
                    <button onClick={()=>setShowManualInput(true)} className="w-full bg-institutional-yellow text-gray-800 py-4 px-6 rounded-xl font-semibold  transition-all shadow-lg flex items-center justify-center gap-3 text-lg border-2 border-institutional-blue ">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="2" y1="17" x2="22" y2="17"></line></svg>
                      Ingreso Manual
                    </button>
                  </div>
                  <div className="mt-8 p-4 bg-blue-50 rounded-lg border-2 border-institutional-blue">
                    <p className="text-sm text-institutional-blue text-center flex items-center justify-center gap-2">
                      <i data-lucide="info" style={{width:18,height:18}}></i>
                      <strong>Nota:</strong> El sistema valida automáticamente que no existan registros duplicados del mismo día
                    </p>
                  </div>
                </div>
              </div>
            ) : (
              <AttendanceHistory
                records={records}
                loading={loading}
                onRefresh={loadAttendanceRecords}
                userRole={userRole}
                userData={userData}
                onJustify={handleJustification}
              />
            )}
          </main>
          {showScanner && <QRScanner onScan={findStudent} onClose={()=>setShowScanner(false)} />}
          {showManualInput && <ManualInput onSubmit={findStudent} onClose={()=>setShowManualInput(false)} />}
          {selectedStudent && <StudentModal student={selectedStudent} onConfirm={handleConfirmAttendance} onClose={()=>setSelectedStudent(null)} isSubmitting={isSubmitting} userData={userData} />}
          {justificationRecord && <JustificationModal record={justificationRecord} onClose={()=>setJustificationRecord(null)} onSubmit={submitJustification} isSubmitting={isSubmitting} />}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
