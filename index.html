    const getEcuadorDateTime = () => {
      const now = new Date();
      const ecuadorOffset = -5 * 60 * 60 * 1000;
      const localOffset = now.getTimezoneOffset() * 60 * 1000;
      const ecuadorTime = new Date(now.getTime() + localOffset + ecuadorOffset);
      return {
        date: ecuadorTime,
        dateString: ecuadorTime.getFullYear() + '-' +
                    String(ecuadorTime.getMonth() + 1).padStart(2, '0') + '-' +
                    String(ecuadorTime.getDate()).padStart(2, '0'),
        timeString: String(ecuadorTime.getHours()).padStart(2, '0') + ':' +
                    String(ecuadorTime.getMinutes()).padStart(2, '0'),
        displayDate: String(ecuadorTime.getDate()).padStart(2, '0') + '/' +
                     String(ecuadorTime.getMonth() + 1).padStart(2, '0') + '/' +
                     ecuadorTime.getFullYear()
      };
    };
    const normalizeName = (name) => {
      if (!name) return '';
      return name
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    };
    const namesMatch = (name1, name2) => {
      if (!name1 || !name2) return false;
      const normalized1 = normalizeName(name1);
      const normalized2 = normalizeName(name2);
      if (normalized1 === normalized2) return true;
      const words1 = normalized1.split(' ').filter(w => w.length > 2);
      const words2 = normalized2.split(' ').filter(w => w.length > 2);
      const matchingWords = words1.filter(w1 => words2.some(w2 => w1 === w2 || w1.includes(w2) || w2.includes(w1)));
      return matchingWords.length >= 2;
    };
    const supabaseRequest = async (endpoint, method = 'GET', body = null) => {
      const options = {
        method,
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        }
      };
      if (body) options.body = JSON.stringify(body);
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, options);
      if (!res.ok) {
        let errText = 'Error en la petición';
        try { const j = await res.json(); errText = j.message || j.error || errText; } catch {}
        throw new Error(errText);
      }
      return res.json();
    };
    function FileUpload({ onFileSelect, selectedFile }) {
      const [isDragging, setIsDragging] = useState(false);
      const fileInputRef = useRef(null);
      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };
      const handleDragLeave = () => {
        setIsDragging(false);
      };
      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        const file = e.dataTransfer.files[0];
        if (file) onFileSelect(file);
      };
      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (file) onFileSelect(file);
      };
      useEffect(() => { if (window.lucide) window.lucide.replace(); }, [selectedFile]);
      return (
        <div className="">
          <label className="block text-sm font-semibold text-gray-700 mb-2">
            Adjuntar Evidencia (Opcional)
          </label>
          <div
            className={`file-upload-zone rounded-lg p-6 text-center cursor-pointer ${isDragging ? 'drag-over' : ''}`}
            onDragOver={handleDragOver}
            onDragLeave={handleDragLeave}
            onDrop={handleDrop}
            onClick={() => fileInputRef.current?.click()}
          >
            <input
              ref={fileInputRef}
              type="file"
              onChange={handleFileChange}

    function Login({ onLogin }) {
      const [userType, setUserType] = useState('estudiante');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [nombreCompleto, setNombreCompleto] = useState('');
      const [cedula, setCedula] = useState('');
      const [nivelEducativo, setNivelEducativo] = useState('');
      const [anoGrado, setAnoGrado] = useState('');
      const [especialidad, setEspecialidad] = useState('');
      const [paralelo, setParalelo] = useState('');
      const [showRegister, setShowRegister] = useState(false);
      const getAnoGradoOptions = () => {
        if (!nivelEducativo) return [];
        const nivel = CURSOS_ESTRUCTURA[nivelEducativo];
        if (!nivel) return [];
        return Object.keys(nivel.cursos);
      };
      const getParalelosDisponibles = () => {
        if (!nivelEducativo || !anoGrado) return [];
        const nivel = CURSOS_ESTRUCTURA[nivelEducativo];
        if (!nivel) return [];
        const curso = nivel.cursos[anoGrado];
        if (!curso) return [];
        if (curso.especialidades) {
          if (!especialidad) return [];
          const esp = curso.especialidades[especialidad];
          return esp ? esp.paralelos : [];
        }
        return curso.paralelos || [];
      };
      const getEspecialidadesDisponibles = () => {
        if (nivelEducativo !== 'bachillerato' || !anoGrado) return [];
        const nivel = CURSOS_ESTRUCTURA.bachillerato;
        const curso = nivel.cursos[anoGrado];
        if (!curso || !curso.especialidades) return [];
        return Object.keys(curso.especialidades);
      };
      const construirCursoCompleto = () => {
        if (!nivelEducativo || !anoGrado || !paralelo) return '';
        const nivel = CURSOS_ESTRUCTURA[nivelEducativo];
        if (!nivel) return '';
        const curso = nivel.cursos[anoGrado];
        if (!curso) return '';
        if (curso.especialidades && especialidad) {
          const esp = curso.especialidades[especialidad];
          if (!esp) return '';
          return esp.formatoDB.replace('{paralelo}', paralelo);
        }
        if (curso.formatoDB) {
          return curso.formatoDB.replace('{paralelo}', paralelo);
        }
        return '';
      };
      useEffect(() => {
        setAnoGrado('');
        setEspecialidad('');
        setParalelo('');
      }, [nivelEducativo]);
      useEffect(() => {
        setEspecialidad('');
        setParalelo('');
      }, [anoGrado]);
      useEffect(() => {
        setParalelo('');
      }, [especialidad]);
      const handleLogin = async () => {
        setError('');
        setSuccess('');
        if (!email.trim() || !password.trim()) {
          setError('Por favor completa todos los campos');
          return;
        }
        if (userType === 'inspeccion') {
          const user = AUTHORIZED_USERS.find(u => u.email === email && u.password === password);
          if (user) {
            onLogin('inspeccion', email, {
              nombre_completo: user.nombre,
              email: user.email,
              nombreCompletoInspector: user.nombreCompleto
            });
          } else {
            setError('Credenciales de inspección incorrectas');
          }
          return;
        }
        if (!email.endsWith('@est.uepdc.edu.ec')) {
          setError('El correo debe terminar en @est.uepdc.edu.ec');
          return;
        }
        try {
          const users = await supabaseRequest(`usuarios_estudiantes?email=eq.${encodeURIComponent(email)}&select=*`);
          if (!users || users.length === 0) {
            setError('Usuario no encontrado. Por favor regístrate primero.');
            return;
          }
          const user = users[0];
          if (user.password !== password) {
            setError('Contraseña incorrecta');
            return;
          }
          onLogin('estudiante', email, user);
        } catch (err) {
          setError('Error al iniciar sesión: ' + err.message);
        }
      };
      const handleRegister = async () => {
        setError('');
        setSuccess('');
        if (!email.trim() || !password.trim() || !nombreCompleto.trim() || !cedula.trim() || !nivelEducativo || !anoGrado || !paralelo) {
          setError('Por favor completa todos los campos obligatorios');
          return;
        }
        if (nivelEducativo === 'bachillerato' && !especialidad) {
          setError('Por favor selecciona una especialidad');
          return;
        }
        if (!email.endsWith('@est.uepdc.edu.ec')) {
          setError('El correo debe terminar en @est.uepdc.edu.ec');
          return;
        }
        try {
          const existing = await supabaseRequest(`usuarios_estudiantes?email=eq.${encodeURIComponent(email)}&select=*`);
          if (existing && existing.length > 0) {
            setError('Este correo ya está registrado');
            return;
          }
          const newUser = {
            email,
            password,
            nombre_completo: nombreCompleto.toUpperCase(),
            cedula,
            nivel_educativo: nivelEducativo,
            ano_grado: anoGrado,
            especialidad: especialidad || null,
            paralelo,
            curso_completo: construirCursoCompleto(),
            fecha_registro: new Date().toISOString()
          };
          await supabaseRequest('usuarios_estudiantes', 'POST', newUser);
          setSuccess('Registro exitoso. Ahora puedes iniciar sesión.');
          setShowRegister(false);
        } catch (err) {
          setError('Error al registrar: ' + err.message);
        }
      };
      return (
        <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 via-blue-700 to-blue-900 p-4">

              </div>
              <h2 className="text-3xl font-black text-institutional-blue tracking-tight">SISTEMA DE ATRASOS</h2>
              <p className="text-gray-500 font-medium mt-2 uppercase text-xs tracking-widest">Unidad Educativa Particular "De la Cuadra"</p>
            </div>
            <div className="flex bg-gray-100 p-1 rounded-2xl mb-6">
              <button
                onClick={() => { setUserType('estudiante'); setShowRegister(false); }}
                className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all ${userType === 'estudiante' ? 'bg-white text-institutional-blue shadow-md' : 'text-gray-500 hover:text-gray-700'}`}
              >
                Estudiante
              </button>
              <button

            </div>

            <div className="space-y-5">
              {userType === 'inspeccion' ? (
                <div className="space-y-4">
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-gray-500 ml-1 uppercase">Correo de Inspección</label>
                    <div className="relative">
                      <i data-lucide="mail" className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" style={{width:18,height:18}}></i>
                      <input

                        placeholder="usuario@uepdc.edu.ec"

                      <input

                        onChange={(e) => setPassword(e.target.value)}

                  </div>

                    <span>INICIAR SESIÓN</span>

                      <i data-lucide="mail" className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" style={{width:18,height:18}}></i>

                        placeholder="usuario@est.uepdc.edu.ec"
                      />
                    </div>
                  </div>
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-gray-500 ml-1 uppercase">Contraseña</label>
                    <div className="relative">
                      <i data-lucide="lock" className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" style={{width:18,height:18}}></i>
                      <input
                        type="password"
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}

                      />

                  <button

                  >
                    <span>INICIAR SESIÓN</span>
                    <i data-lucide="arrow-right" style={{width:20,height:20}}></i>
                  </button>
                  <div className="text-center mt-4">
                    <p className="text-sm text-gray-500 font-medium">
                      ¿No tienes cuenta?{' '}
                      <button

                        className="text-institutional-blue font-black hover:underline"
                      >

                      </button>

                  </div>

              ) : userType === 'estudiante' && showRegister ? (

                    <input

                      value={nombreCompleto}
                      onChange={(e) => setNombreCompleto(e.target.value)}

                    />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-2">
                      <i data-lucide="mail" style={{width:16,height:16}} className="text-institutional-blue"></i>
                      Correo Institucional *
                    </label>
                    <input
                      type="email"
                      value={email}
                      onChange={(e) => setEmail(e.target.value.toLowerCase())}
                      placeholder="tuemail@est.uepdc.edu.ec"
                      className="w-full border-2 border-institutional-blue rounded-lg p-3 focus:ring-2 focus:ring-institutional-yellow transition-all"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-2">
                      <i data-lucide="credit-card" style={{width:16,height:16}} className="text-institutional-blue"></i>
                      Cédula *
                    </label>
                    <input
                      type="text"
                      value={cedula}
                      onChange={(e) => setCedula(e.target.value)}
                      placeholder="0123456789"
                      className="w-full border-2 border-institutional-blue rounded-lg p-3 focus:ring-2 focus:ring-institutional-yellow transition-all"
                    />
                  </div>
                  {/* Información Académica */}
                  <div className="form-section-header">
                    <i data-lucide="book-open" style={{width:20,height:20}}></i>
                    Información Académica
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-2">
                      <i data-lucide="graduation-cap" style={{width:16,height:16}} className="text-institutional-blue"></i>
                      Nivel Educativo *
                    </label>
                    <select
                      value={nivelEducativo}
                      onChange={(e) => setNivelEducativo(e.target.value)}
                      className="w-full border-2 border-institutional-blue rounded-lg p-3 focus:ring-2 focus:ring-institutional-yellow transition-all"
                    >
                      <option value="">Selecciona el nivel</option>
                      {Object.entries(CURSOS_ESTRUCTURA).map(([key, nivel]) => (
                        <option key={key} value={key}>{nivel.nombre}</option>
                      ))}
                    </select>
                  </div>
                  {nivelEducativo && getAnoGradoOptions().length > 0 && (
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-2">
                        <i data-lucide="calendar" style={{width:16,height:16}} className="text-institutional-blue"></i>
                        Año/Grado *
                      </label>
                      <select
                        value={anoGrado}
                        onChange={(e) => setAnoGrado(e.target.value)}
                        className="w-full border-2 border-institutional-blue rounded-lg p-3 focus:ring-2 focus:ring-institutional-yellow transition-all"
                      >
                        <option value="">Selecciona el grado</option>
                        {getAnoGradoOptions().map(option => (
                          <option key={option} value={option}>{option}</option>
                        ))}
                      </select>
                    </div>
                  )}
                  {nivelEducativo === 'bachillerato' && anoGrado && getEspecialidadesDisponibles().length > 0 && (
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-2">
                        <i data-lucide="award" style={{width:16,height:16}} className="text-institutional-blue"></i>
                        Especialidad *
                      </label>
                      <select
                        value={especialidad}
                        onChange={(e) => setEspecialidad(e.target.value)}
                        className="w-full border-2 border-institutional-blue rounded-lg p-3 focus:ring-2 focus:ring-institutional-yellow transition-all"
                      >
                        <option value="">Selecciona la especialidad</option>
                        {getEspecialidadesDisponibles().map(esp => (
                          <option key={esp} value={esp}>
                            {esp === 'BGU Ciencias' ? '🔬 ' : esp === 'TICS Informática' ? '💻 ' : '💼 '}{esp}
                          </option>
                        ))}
                      </select>
                    </div>
                  )}
                  {anoGrado && getParalelosDisponibles().length > 0 && (
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-2">
                        <i data-lucide="layout" style={{width:16,height:16}} className="text-institutional-blue"></i>
                        Paralelo *
                      </label>
                      <select
                        value={paralelo}
                        onChange={(e) => setParalelo(e.target.value)}
                        className="w-full border-2 border-institutional-blue rounded-lg p-3 focus:ring-2 focus:ring-institutional-yellow transition-all"
                      >
                        <option value="">Selecciona el paralelo</option>
                        {getParalelosDisponibles().map(p => (
                          <option key={p} value={p}>{p}</option>
                        ))}
                      </select>
                    </div>
                  )}
                  {/* Seguridad */}
                  <div className="form-section-header">
                    <i data-lucide="lock" style={{width:20,height:20}}></i>
                    Seguridad
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-2">
                      <i data-lucide="key" style={{width:16,height:16}} className="text-institutional-blue"></i>
                      Contraseña *
                    </label>
                    <input
                      type="password"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="Mínimo 6 caracteres"
                      className="w-full border-2 border-institutional-blue rounded-lg p-3 focus:ring-2 focus:ring-institutional-yellow transition-all"
                    />
                  </div>
                  <div className="pt-4 space-y-3">
                    <button
                      onClick={handleRegister}
                      className="w-full bg-institutional-blue hover:bg-institutional-blue-dark text-white py-4 rounded-2xl font-black text-lg shadow-xl shadow-blue-200 transition-all active:scale-95"
                    >
                      CREAR CUENTA
                    </button>
                    <button
                      onClick={() => setShowRegister(false)}
                      className="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 py-3 rounded-2xl font-bold text-sm transition-all"
                    >
                      VOLVER AL INICIO
                    </button>
                  </div>
                </div>
              ) : null}
            </div>
          </div>
        </div>
      );
    }
    function App() {
      const [userRole, setUserRole] = useState(null);
      const [userEmail, setUserEmail] = useState('');
      const [userData, setUserData] = useState(null);
      const [records, setRecords] = useState([]);
      const [loading, setLoading] = useState(false);
      const [showScanner, setShowScanner] = useState(false);
      const [showManualInput, setShowManualInput] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [notification, setNotification] = useState(null);
      const [activeTab, setActiveTab] = useState('historial');
      const [showJustifyModal, setShowJustifyModal] = useState(false);
      const [justificationRecord, setJustificationRecord] = useState(null);
      const [justificationReason, setJustificationReason] = useState('');
      const [justificationFile, setJustificationFile] = useState(null);
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const scannerInterval = useRef(null);
      const showNotification = (type, message) => {
        setNotification({ type, message });
        setTimeout(() => setNotification(null), 5000);
      };
      const handleLogin = (role, email, data) => {
        setUserRole(role);
        setUserEmail(email);
        setUserData(data);
        loadAttendanceRecords();
      };
      const handleLogout = () => {
        setUserRole(null);
        setUserEmail('');
        setUserData(null);
        setRecords([]);
      };
      const startScanner = async () => {
        setShowScanner(true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.setAttribute('playsinline', 'true');
            videoRef.current.play();
            scannerInterval.current = setInterval(scanQRCode, 200);
          }
        } catch (err) {
          showNotification('error', 'No se pudo acceder a la cámara');
          setShowScanner(false);
        }
      };
      const stopScanner = () => {
        if (scannerInterval.current) clearInterval(scannerInterval.current);
        if (videoRef.current && videoRef.current.srcObject) {
          const tracks = videoRef.current.srcObject.getTracks();
          tracks.forEach(track => track.stop());
        }
        setShowScanner(false);
      };
      const scanQRCode = () => {
        if (videoRef.current && canvasRef.current) {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          const context = canvas.getContext('2d');
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.height = video.videoHeight;
            canvas.width = video.videoWidth;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
            if (code) {
              stopScanner();
              handleSearch(code.data);
            }
          }
        }
      };
      const handleSearch = async (term) => {
        setIsSubmitting(true);
        try {
          const searchVal = term || searchTerm;
          if (!searchVal || searchVal.trim() === '') {
            showNotification('error', 'Ingrese el nombre del estudiante');
            setIsSubmitting(false);
            setShowScanner(false);
            setShowManualInput(false);
            return;
          }
          let results = null;
          const likePattern = encodeURIComponent(`%${searchVal}%`);
          // BUSQUEDA CORREGIDA: Busca en la tabla atrasos donde fecha_atraso es NULL (catálogo)
          results = await supabaseRequest(
            `atrasos?select=*&Nombre completo estudiante=ilike.${likePattern}&fecha_atraso=is.null&limit=5`
          );
          if (!results || results.length === 0) {
            results = await supabaseRequest(
              `atrasos?select=*&Curso=ilike.${likePattern}&fecha_atraso=is.null&limit=5`
            );
          }
          if (!results || results.length === 0) {
            const numericId = parseInt(searchVal);
            if (!isNaN(numericId)) {
              results = await supabaseRequest(
                `atrasos?select=*&N=eq.${numericId}&fecha_atraso=is.null&limit=1`
              );
            }
          }
          if (!results || results.length === 0) {
            results = await supabaseRequest(
              `atrasos?select=*&Nombre completo estudiante=ilike.${likePattern}&limit=5`
            );
          }
          if (!results || results.length === 0) {
            showNotification('error', 'Estudiante no encontrado en la base de datos');
            setIsSubmitting(false);
            setShowScanner(false);
            setShowManualInput(false);
            return;
          }
          const student = results[0];
          const ecuadorDateTime = getEcuadorDateTime();
          const today = ecuadorDateTime.dateString;
          const studentNameEncoded = encodeURIComponent(student['Nombre completo estudiante']);
          const existingRecords = await supabaseRequest(
            `atrasos?select=*&Nombre completo estudiante=eq.${studentNameEncoded}&fecha_atraso=eq.${today}&estado=eq.confirmado`
          );
          if (existingRecords && existingRecords.length > 0) {
            showNotification('error', 'Este estudiante ya tiene un registro de atraso confirmado hoy');
            setIsSubmitting(false);
            setShowScanner(false);
            setShowManualInput(false);
            return;
          }
          const studentToConfirm = {
            'Nombre completo estudiante': student['Nombre completo estudiante'],
            'Curso': student.Curso,
            'Email estudiante': student['Email estudiante']
          };
          setSelectedStudent(studentToConfirm);
          setShowScanner(false);
          setShowManualInput(false);
          setIsSubmitting(false);
        } catch (err) {
          console.error('Error al buscar estudiante:', err);
          showNotification('error', 'Error en la búsqueda: ' + err.message);
          setIsSubmitting(false);
          setShowScanner(false);
          setShowManualInput(false);
        }
      };
      const handleConfirmAttendance = async (recordedBy) => {
        setIsSubmitting(true);
        try {
          const ecuadorDateTime = getEcuadorDateTime();
          const newRecord = {
            'Nombre completo estudiante': selectedStudent['Nombre completo estudiante'],
            Curso: selectedStudent.Curso,
            'Email estudiante': selectedStudent['Email estudiante'] || null,
            fecha_atraso: ecuadorDateTime.dateString,
            hora_llegada: ecuadorDateTime.timeString,
            registrado_por: recordedBy,
            estado: 'confirmado'
          };
          // REGISTRO CORREGIDO: Inserta un nuevo registro de atraso
          await supabaseRequest(`atrasos`, 'POST', newRecord);
          showNotification('success', `Atraso confirmado para ${selectedStudent['Nombre completo estudiante']}`);
          setSelectedStudent(null);
          await loadAttendanceRecords();
        } catch (err) {
          console.error('Error al guardar:', err);
          showNotification('error','Error al registrar el atraso: ' + err.message);
        } finally {
          setIsSubmitting(false);
        }
      };
      const loadAttendanceRecords = async () => {
        setLoading(true);
        try {
          // Carga solo los registros que TIENEN fecha (los atrasos reales)
          const allRecords = await supabaseRequest('atrasos?select=*&fecha_atraso=not.is.null&order=fecha_atraso.desc,hora_llegada.desc&limit=1000');
          setRecords(allRecords || []);
        } catch (err) {
          console.error('Error al cargar registros:', err);
          showNotification('error','Error al cargar el historial: ' + err.message);
          setRecords([]);
        } finally {
          setLoading(false);
        }
      };
      const handleJustify = async () => {
        if (!justificationReason.trim()) {
          showNotification('error', 'Debe ingresar un motivo de justificación');
          return;
        }
        setIsSubmitting(true);
        try {
          const updateData = {
            motivo_atraso: justificationReason,
            estado: 'justificado',
            fecha_justificacion: new Date().toISOString()
          };
          await supabaseRequest(`atrasos?N=eq.${justificationRecord.N}`, 'PATCH', updateData);
          showNotification('success', 'Atraso justificado correctamente');
          setShowJustifyModal(false);
          setJustificationReason('');
          setJustificationFile(null);
          await loadAttendanceRecords();
        } catch (err) {
          showNotification('error', 'Error al justificar: ' + err.message);
        } finally {
          setIsSubmitting(false);
        }
      };
      if (!userRole) {
        return <Login onLogin={handleLogin} />;
      }
      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 via-white to-yellow-50">
          <header className="bg-institutional-blue shadow-lg border-b-4 border-institutional-yellow">
            <div className="container mx-auto px-4 py-6">
              <div className="flex justify-between items-center flex-wrap gap-4">
                <div className="flex items-center gap-4">
                  <img src={LOGO_URL} alt="UEPDC Logo" className="logo-container" />
                  <div>
                    <h1 className="text-2xl md:text-3xl font-bold text-white drop-shadow-lg flex items-center gap-3">
                      Sistema de Atrasos
                    </h1>
                    <p className="text-yellow-200 mt-1 font-semibold text-sm">
                      {userRole === 'inspeccion' ? '🛡️ Panel de Inspección' : '👨‍🎓 Panel de Estudiantes'} - {userData?.nombreCompletoInspector || userData?.nombre_completo || userEmail}
                    </p>
                  </div>
                </div>
                <button
                  onClick={handleLogout}
                  className="bg-gradient-to-r from-institutional-yellow to-institutional-yellow-dark text-gray-800 px-6 py-2.5 rounded-lg font-bold   flex items-center gap-2 border-2 border-white  shadow-lg transition-all"
                >
                  <i data-lucide="log-out" style={{width:20,height:20}}></i>
                  <span>Cerrar Sesión</span>
                </button>
              </div>
            </div>
          </header>
          <main className="container mx-auto px-4 py-8">
            {notification && (
              <Notification
                type={notification.type}
                message={notification.message}
                onClose={() => setNotification(null)}
              />
            )}
            {userRole === 'inspeccion' ? (
              <div className="space-y-8">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <button
                    onClick={startScanner}
                    className="bg-white p-8 rounded-2xl shadow-xl border-2 border-institutional-blue hover:border-institutional-yellow transition-all group flex flex-col items-center gap-4"
                  >
                    <div className="bg-blue-50 p-6 rounded-full group-hover:bg-yellow-50 transition-colors">
                      <i data-lucide="qr-code" style={{width:48,height:48}} className="text-institutional-blue group-hover:text-institutional-yellow-dark"></i>
                    </div>
                    <span className="text-xl font-bold text-institutional-blue">Escanear Código QR</span>
                  </button>
                  <button
                    onClick={() => setShowManualInput(true)}
                    className="bg-white p-8 rounded-2xl shadow-xl border-2 border-institutional-blue hover:border-institutional-yellow transition-all group flex flex-col items-center gap-4"
                  >
                    <div className="bg-blue-50 p-6 rounded-full group-hover:bg-yellow-50 transition-colors">
                      <i data-lucide="keyboard" style={{width:48,height:48}} className="text-institutional-blue group-hover:text-institutional-yellow-dark"></i>
                    </div>
                    <span className="text-xl font-bold text-institutional-blue">Ingreso Manual</span>
                  </button>
                </div>
                <div className="bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-100">
                  <div className="bg-gray-50 px-6 py-4 border-b flex justify-between items-center">
                    <h2 className="text-xl font-bold text-institutional-blue flex items-center gap-2">
                      <i data-lucide="list" style={{width:24,height:24}}></i>
                      Historial de Atrasos
                    </h2>
                    <button
                      onClick={loadAttendanceRecords}
                      className="text-institutional-blue hover:rotate-180 transition-all duration-500"
                    >
                      <i data-lucide="refresh-cw" style={{width:20,height:20}}></i>
                    </button>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left">
                      <thead className="bg-blue-50 text-institutional-blue uppercase text-xs font-bold">
                        <tr>
                          <th className="px-6 py-4">Estudiante</th>
                          <th className="px-6 py-4">Curso</th>
                          <th className="px-6 py-4">Fecha</th>
                          <th className="px-6 py-4">Hora</th>
                          <th className="px-6 py-4">Estado</th>
                          <th className="px-6 py-4">Acciones</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {loading ? (
                          <tr>
                            <td colSpan="6" className="px-6 py-12 text-center">
                              <div className="spinner w-10 h-10 border-4 border-institutional-blue border-t-transparent rounded-full mx-auto"></div>
                              <p className="mt-4 text-gray-500 font-medium">Cargando registros...</p>
                            </td>
                          </tr>
                        ) : records.length === 0 ? (
                          <tr>
                            <td colSpan="6" className="px-6 py-12 text-center text-gray-500">
                              No hay registros de atrasos encontrados.
                            </td>
                          </tr>
                        ) : (
                          records.map((record) => (
                            <tr key={record.N} className="hover:bg-gray-50 transition-colors">
                              <td className="px-6 py-4 font-bold text-gray-800">{record['Nombre completo estudiante']}</td>
                              <td className="px-6 py-4 text-gray-600">{record.Curso}</td>
                              <td className="px-6 py-4 text-gray-600">{record.fecha_atraso}</td>
                              <td className="px-6 py-4 font-semibold text-institutional-blue">{record.hora_llegada}</td>
                              <td className="px-6 py-4">
                                <span className={`px-3 py-1 rounded-full text-xs font-bold uppercase ${
                                  record.estado === 'justificado' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'
                                }`}>
                                  {record.estado || 'pendiente'}
                                </span>
                              </td>
                              <td className="px-6 py-4">
                                {record.estado !== 'justificado' && (
                                  <button
                                    onClick={() => { setJustificationRecord(record); setShowJustifyModal(true); }}
                                    className="text-institutional-blue hover:text-institutional-yellow-dark font-bold text-sm flex items-center gap-1"
                                  >
                                    <i data-lucide="edit-3" style={{width:16,height:16}}></i>
                                    Justificar
                                  </button>
                                )}
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            ) : (
              <div className="max-w-4xl mx-auto space-y-8">
                <div className="bg-white p-8 rounded-3xl shadow-2xl border-t-8 border-institutional-blue relative overflow-hidden">
                  <div className="absolute top-0 right-0 p-4 opacity-10">
                    <i data-lucide="graduation-cap" style={{width:120,height:120}}></i>
                  </div>
                  <div className="flex items-center gap-6 mb-8">
                    <div className="bg-blue-100 p-4 rounded-2xl">
                      <i data-lucide="user" style={{width:48,height:48}} className="text-institutional-blue"></i>
                    </div>
                    <div>
                      <h2 className="text-3xl font-black text-gray-800">{userData?.nombre_completo}</h2>
                      <p className="text-institutional-blue font-bold text-lg">{userData?.curso_completo}</p>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <div className="bg-gray-50 p-6 rounded-2xl border-2 border-gray-100 text-center">
                      <p className="text-gray-500 font-bold uppercase text-xs mb-2">Total Atrasos</p>
                      <p className="text-4xl font-black text-institutional-blue">
                        {records.filter(r => namesMatch(r['Nombre completo estudiante'], userData?.nombre_completo)).length}
                      </p>
                    </div>
                    <div className="bg-gray-50 p-6 rounded-2xl border-2 border-gray-100 text-center">
                      <p className="text-gray-500 font-bold uppercase text-xs mb-2">Justificados</p>
                      <p className="text-4xl font-black text-green-600">
                        {records.filter(r => namesMatch(r['Nombre completo estudiante'], userData?.nombre_completo) && r.estado === 'justificado').length}
                      </p>
                    </div>
                    <div className="bg-gray-50 p-6 rounded-2xl border-2 border-gray-100 text-center">
                      <p className="text-gray-500 font-bold uppercase text-xs mb-2">Pendientes</p>
                      <p className="text-4xl font-black text-red-600">
                        {records.filter(r => namesMatch(r['Nombre completo estudiante'], userData?.nombre_completo) && r.estado !== 'justificado').length}
                      </p>
                    </div>
                  </div>
                </div>
                <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
                  <div className="bg-gray-50 px-6 py-4 border-b">
                    <h3 className="text-xl font-bold text-institutional-blue flex items-center gap-2">
                      <i data-lucide="history" style={{width:24,height:24}}></i>
                      Mi Historial de Atrasos
                    </h3>
                  </div>
                  <div className="divide-y divide-gray-100">
                    {records.filter(r => namesMatch(r['Nombre completo estudiante'], userData?.nombre_completo)).length === 0 ? (
                      <div className="p-12 text-center text-gray-500">
                        <i data-lucide="smile" style={{width:48,height:48}} className="mx-auto mb-4 text-green-400"></i>
                        <p className="text-lg font-bold">¡Excelente! No tienes atrasos registrados.</p>
                      </div>
                    ) : (
                      records.filter(r => namesMatch(r['Nombre completo estudiante'], userData?.nombre_completo)).map((record) => (
                        <div key={record.N} className="p-6 hover:bg-gray-50 transition-all flex justify-between items-center">
                          <div>
                            <p className="text-lg font-bold text-gray-800">{record.fecha_atraso}</p>
                            <p className="text-institutional-blue font-semibold flex items-center gap-1">
                              <i data-lucide="clock" style={{width:16,height:16}}></i>
                              {record.hora_llegada}
                            </p>
                          </div>
                          <div className="text-right">
                            <span className={`px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider ${
                              record.estado === 'justificado' ? 'bg-green-100 text-green-700 border border-green-200' : 'bg-red-100 text-red-700 border border-red-200'
                            }`}>
                              {record.estado || 'pendiente'}
                            </span>
                            {record.motivo_atraso && (
                              <p className="text-xs text-gray-500 mt-2 italic max-w-[200px]">"{record.motivo_atraso}"</p>
                            )}
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}
          </main>
          {/* Modales */}
          {showScanner && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden">
                <div className="p-6 border-b flex justify-between items-center bg-institutional-blue text-white">
                  <h3 className="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="camera" style={{width:24,height:24}}></i>
                    Escaneando Código QR
                  </h3>
                  <button onClick={stopScanner} className="hover:rotate-90 transition-all">
                    <i data-lucide="x" style={{width:28,height:28}}></i>
                  </button>
                </div>
                <div className="relative aspect-square bg-black">
                  <video ref={videoRef} className="w-full h-full object-cover"></video>
                  <canvas ref={canvasRef} className="hidden"></canvas>
                  <div className="absolute inset-0 border-[40px] border-black/40 pointer-events-none">
                    <div className="w-full h-full border-4 border-institutional-yellow rounded-2xl animate-pulse"></div>
                  </div>
                </div>
                <div className="p-6 text-center">
                  <p className="text-gray-600 font-medium">Coloque el código QR del estudiante frente a la cámara</p>
                </div>
              </div>
            </div>
          )}
          {showManualInput && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-in zoom-in-95 duration-300">
                <div className="p-6 border-b flex justify-between items-center bg-institutional-blue text-white">
                  <h3 className="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="search" style={{width:24,height:24}}></i>
                    Búsqueda Manual
                  </h3>
                  <button onClick={() => setShowManualInput(false)} className="hover:rotate-90 transition-all">
                    <i data-lucide="x" style={{width:28,height:28}}></i>
                  </button>
                </div>
                <div className="p-8 space-y-6">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wider">Nombre del Estudiante</label>
                    <input
                      type="text"
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      placeholder="Ej: Juan Pérez"
                      className="w-full border-2 border-gray-200 rounded-2xl p-4 focus:border-institutional-blue focus:ring-0 transition-all font-bold"
                      onKeyPress={(e) => e.key === 'Enter' && handleSearch()}
                    />
                  </div>
                  <button
                    onClick={() => handleSearch()}
                    disabled={isSubmitting}
                    className="w-full bg-institutional-yellow hover:bg-institutional-yellow-dark text-gray-800 py-4 rounded-2xl font-black text-lg shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3"
                  >
                    {isSubmitting ? <div className="spinner w-6 h-6 border-4 border-gray-800 border-t-transparent rounded-full"></div> : 'BUSCAR ESTUDIANTE'}
                  </button>
                </div>
              </div>
            </div>
          )}
          {selectedStudent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-in slide-in-from-bottom-8 duration-300">
                <div className="bg-institutional-blue p-8 text-white text-center relative">
                  <div className="bg-white p-4 rounded-2xl shadow-lg inline-block mb-4 border-2 border-institutional-yellow">
                    <i data-lucide="user-check" style={{width:48,height:48}} className="text-institutional-blue"></i>
                  </div>
                  <h3 className="text-2xl font-black leading-tight">{selectedStudent['Nombre completo estudiante']}</h3>
                  <p className="text-yellow-200 font-bold mt-2 uppercase tracking-widest text-xs">{selectedStudent.Curso}</p>
                </div>
                <div className="p-8 space-y-4">
                  <div className="bg-blue-50 p-4 rounded-2xl border-2 border-blue-100 flex items-center gap-4">
                    <i data-lucide="clock" className="text-institutional-blue" style={{width:24,height:24}}></i>
                    <div>
                      <p className="text-xs font-bold text-gray-500 uppercase">Hora de Llegada</p>
                      <p className="text-xl font-black text-institutional-blue">{getEcuadorDateTime().timeString}</p>
                    </div>
                  </div>
                  <button
                    onClick={() => handleConfirmAttendance(userData?.nombreCompletoInspector)}
                    disabled={isSubmitting}
                    className="w-full bg-institutional-blue hover:bg-institutional-blue-dark text-white py-5 rounded-2xl font-black text-xl shadow-2xl shadow-blue-200 transition-all active:scale-95"
                  >
                    {isSubmitting ? 'GUARDANDO...' : 'CONFIRMAR REGISTRO'}
                  </button>
                  <button
                    onClick={() => setSelectedStudent(null)}
                    className="w-full text-gray-400 font-bold py-2 hover:text-red-500 transition-colors"
                  >
                    CANCELAR
                  </button>
                </div>
              </div>
            </div>
          )}
          {showJustifyModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden animate-in zoom-in-95 duration-300">
                <div className="p-6 border-b flex justify-between items-center bg-institutional-blue text-white">
                  <h3 className="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="edit-3" style={{width:24,height:24}}></i>
                    Justificar Atraso
                  </h3>
                  <button onClick={() => setShowJustifyModal(false)} className="hover:rotate-90 transition-all">
                    <i data-lucide="x" style={{width:28,height:28}}></i>
                  </button>
                </div>
                <div className="p-8 space-y-6">
                  <div className="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                    <p className="text-xs font-bold text-gray-400 uppercase mb-1">Estudiante</p>
                    <p className="text-lg font-black text-gray-800">{justificationRecord?.['Nombre completo estudiante']}</p>
                    <p className="text-sm text-institutional-blue font-bold">{justificationRecord?.fecha_atraso} - {justificationRecord?.hora_llegada}</p>
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wider">Motivo de Justificación *</label>
                    <textarea
                      value={justificationReason}
                      onChange={(e) => setJustificationReason(e.target.value)}
                      placeholder="Ej: Cita médica, problema de transporte..."
                      className="w-full border-2 border-gray-200 rounded-2xl p-4 focus:border-institutional-blue focus:ring-0 transition-all font-medium h-32 resize-none"
                    ></textarea>
                  </div>
                  <FileUpload onFileSelect={setJustificationFile} selectedFile={justificationFile} />
                  <button
                    onClick={handleJustify}
                    disabled={isSubmitting}
                    className="w-full bg-institutional-yellow hover:bg-institutional-yellow-dark text-gray-800 py-4 rounded-2xl font-black text-lg shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3"
                  >
                    {isSubmitting ? <div className="spinner w-6 h-6 border-4 border-gray-800 border-t-transparent rounded-full"></div> : 'GUARDAR JUSTIFICACIÓN'}
                  </button>
                </div>
              </div>
            </div>
          )}
          <footer className="container mx-auto px-4 py-12 text-center">
            <div className="flex justify-center items-center gap-4 mb-4 opacity-30">
              <div className="h-px w-12 bg-gray-400"></div>
              <img src={LOGO_URL} alt="Logo" className="w-8 h-8 grayscale" />
              <div className="h-px w-12 bg-gray-400"></div>
            </div>
            <p className="text-[10px] font-black text-gray-400 uppercase tracking-[0.3em]">
              © 2025 Unidad Educativa Particular "De la Cuadra"
            </p>
            <p className="text-[9px] font-bold text-gray-400 uppercase tracking-widest mt-1">
              Sistema de Gestión de Asistencia e Inspección
            </p>
          </footer>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
